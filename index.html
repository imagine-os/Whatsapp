<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Your WhatsApp project chat as a mind map: every task, decision, risk and material, grouped by topic and ready to act on."><meta property="og:type" content="website"><meta property="og:title" content="Threadline"><meta property="og:description" content="Your WhatsApp project chat as a mind map: every task, decision, risk and material, grouped by topic and ready to act on."><meta property="og:url" content="https://imagine-os.github.io/Whatsapp/"><meta property="og:image" content="https://imagine-os.github.io/Whatsapp/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Threadline"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Threadline"><meta name="twitter:description" content="Your WhatsApp project chat as a mind map: every task, decision, risk and material, grouped by topic and ready to act on."><meta name="twitter:image" content="https://imagine-os.github.io/Whatsapp/og.jpg"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%2325FF94'/%3E%3Cellipse cx='16' cy='16' rx='15' ry='6' fill='none' stroke='%23C8FF50' stroke-width='2' transform='rotate(-20 16 16)'/%3E%3C/svg%3E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Threadline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: warm clay desk. Header with project summary, then a pannable mind map (project → threads → groups → items),
   a per-thread flowchart, actions grouped by owner, the chat, and ready-to-send updates. */
:root{
  --bg:#F2ECE1; --desk:#E9E1D2; --surface:#FBF8F2; --surface-hi:#FFFDF9; --ink:#173238; --muted:#687673; --line:#DED4C3;
  --teal:#3FA79E; --coral:#E8714F; --mustard:#E3AE34; --green:#4F9E6F; --sky:#5FA3BD; --plum:#A57DB3;
  --todo:#D99A1E; --done:#4F9E6F; --risk:#D95F3E; --brand:#7C6BB0;
  --on-accent:#13292C; --hi:rgba(255,255,255,.85); --lo:rgba(90,64,28,.08); --shade:rgba(92,66,30,.2);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --clay:0 1px 0 var(--hi) inset,0 -3px 0 var(--lo) inset,0 16px 30px -16px var(--shade),0 3px 6px -2px var(--shade);
  --clay-sm:0 1px 0 var(--hi) inset,0 -2px 0 var(--lo) inset,0 8px 16px -10px var(--shade),0 2px 3px -1px var(--shade);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1916; --desk:#221F1B; --surface:#2A2622; --surface-hi:#322D28; --ink:#F1EADC; --muted:#A79F92; --line:#3B352E;
  --teal:#56BDB3; --coral:#EE8A6C; --mustard:#EBBF57; --green:#6BB88A; --sky:#7FBAD0; --plum:#BE97CB;
  --todo:#EBBF57; --done:#6BB88A; --risk:#EE8A6C; --brand:#A898DA;
  --on-accent:#13201F; --hi:rgba(255,255,255,.06); --lo:rgba(0,0,0,.25); --shade:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1916; --desk:#221F1B; --surface:#2A2622; --surface-hi:#322D28; --ink:#F1EADC; --muted:#A79F92; --line:#3B352E;
  --teal:#56BDB3; --coral:#EE8A6C; --mustard:#EBBF57; --green:#6BB88A; --sky:#7FBAD0; --plum:#BE97CB;
  --todo:#EBBF57; --done:#6BB88A; --risk:#EE8A6C; --brand:#A898DA;
  --on-accent:#13201F; --hi:rgba(255,255,255,.06); --lo:rgba(0,0,0,.25); --shade:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;background-image:radial-gradient(1200px 500px at 70% -10%,var(--surface-hi),transparent 70%)}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,var(--teal),color-mix(in oklab,var(--teal) 70%,#0b3b37));box-shadow:var(--clay-sm);display:grid;place-items:center;color:#fff}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:600;background:linear-gradient(180deg,var(--surface-hi),var(--surface));box-shadow:var(--clay-sm);display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.wa{background:linear-gradient(180deg,color-mix(in oklab,var(--green) 85%,white),var(--green));color:#fff}
.btn.ai{background:linear-gradient(180deg,color-mix(in oklab,var(--coral) 85%,white),var(--coral));color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.ghost{background:none;box-shadow:none;color:var(--muted)}
.top-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 32px;align-items:end;margin:28px 0 20px}
.head-l{min-width:0}
.head h1{font-size:clamp(28px,3.6vw,42px);line-height:1.05;letter-spacing:-.02em;margin-top:4px}
.head p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--clay-sm);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(92px,auto));gap:10px}
.stat{background:linear-gradient(180deg,var(--surface-hi),var(--surface));border-radius:16px;box-shadow:var(--clay-sm);padding:11px 14px;border:0;text-align:left;transition:transform .15s,box-shadow .15s}
button.stat:hover{transform:translateY(-1px);box-shadow:var(--clay)}
button.stat[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--k),var(--clay-sm)}
.stat b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.stat .dot{width:8px;height:8px;border-radius:50%;flex:none}

/* one sticky bar: views on the left, this view's controls on the right */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;justify-content:space-between;padding:8px;margin:0 -8px 14px;border-radius:20px;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.tabs{display:inline-flex;gap:4px;padding:5px;border-radius:16px;background:var(--desk);box-shadow:inset 0 2px 5px var(--lo);flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:12px;font-weight:600;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab svg{width:16px;height:16px}
.tab[aria-selected="true"]{background:linear-gradient(180deg,var(--surface-hi),var(--surface));color:var(--ink);box-shadow:var(--clay-sm)}
.tools{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;justify-content:flex-end}
.tgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tlabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.tsep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
.chip{border:0;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;background:var(--surface);box-shadow:var(--clay-sm);display:inline-flex;align-items:center;gap:7px;color:var(--ink);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:3px;flex:none}
.chip .ck{width:14px;height:14px;border-radius:4px;display:grid;place-items:center;background:var(--k,var(--teal));color:#fff}
.chip .ck svg{width:10px;height:10px}
.chip[aria-pressed="false"]{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.chip[aria-pressed="false"] .ck{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:transparent}
.link{border:0;background:none;color:var(--teal);font-weight:700;font-size:13px;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--desk);box-shadow:inset 0 1px 3px var(--lo)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-hi);color:var(--ink);box-shadow:var(--clay-sm)}
.tools .search{width:260px;max-width:100%;padding:8px 12px}
.spacer{flex:1}

/* type tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-todo{background:color-mix(in oklab,var(--todo) 22%,transparent);color:color-mix(in oklab,var(--todo) 55%,var(--ink))}
.t-done{background:color-mix(in oklab,var(--done) 22%,transparent);color:color-mix(in oklab,var(--done) 60%,var(--ink))}
.t-risk{background:color-mix(in oklab,var(--risk) 22%,transparent);color:color-mix(in oklab,var(--risk) 60%,var(--ink))}
.t-brand{background:color-mix(in oklab,var(--brand) 20%,transparent);color:color-mix(in oklab,var(--brand) 60%,var(--ink))}

/* mind map */
.desk{position:relative;background:var(--desk);border-radius:26px;box-shadow:inset 0 2px 10px var(--lo),0 1px 0 var(--hi);overflow:hidden}
.mm{position:relative;height:clamp(520px,72vh,820px);cursor:grab;touch-action:none;user-select:none}
.mm.grabbing{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.world svg path{fill:none;stroke-linecap:round}
.node{position:absolute;border:0;text-align:left;background:linear-gradient(180deg,var(--surface-hi),var(--surface));box-shadow:var(--clay-sm);border-radius:16px;padding:10px 14px;transition:box-shadow .2s,transform .2s,opacity .3s}
.node:hover{box-shadow:var(--clay)}
.n-root{width:230px;border-radius:22px;padding:16px 18px;background:linear-gradient(160deg,color-mix(in oklab,var(--teal) 88%,white),var(--teal));color:#fff;box-shadow:var(--clay)}
.n-root h3{font-size:19px;line-height:1.15}
.n-root small{display:block;font-size:12px;opacity:.85;margin-top:4px}
.n-thread{width:210px;border-radius:18px;padding:12px 14px;background:linear-gradient(170deg,color-mix(in oklab,var(--c) 82%,white),var(--c));color:var(--on-accent);box-shadow:var(--clay)}
.n-thread h3{font-size:16px;line-height:1.15}
.n-thread small{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:2px}
.n-group{width:auto;min-width:178px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px}
.n-group b{font-size:14px;font-weight:700;flex:1}
.n-group .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.n-group .sw{width:12px;height:12px;border-radius:4px;flex:none}
.n-item{width:310px;padding:10px 12px 10px 14px;border-left:4px solid var(--k)}
.n-item .tx{font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n-item .meta{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.n-item.is-done{opacity:.55}
.n-item.is-done .tx{text-decoration:line-through}
.n-item.sel,.n-entity.sel{outline:3px solid var(--teal);outline-offset:2px}
.n-entity{width:200px;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.n-entity .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.av{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:var(--pc,var(--teal))}
.world svg path.grow{stroke-dasharray:100;stroke-dashoffset:100;animation:grow .7s ease-out forwards;animation-delay:var(--d,0ms)}
@keyframes grow{to{stroke-dashoffset:0}}
.side-l .tog{left:-13px;right:auto}
.n-thread.side-r,.n-group.side-r{padding-right:24px}
.n-thread.side-l,.n-group.side-l{padding-left:24px}
.n-group .av{width:20px;height:20px;font-size:9px;margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.tog{position:absolute;right:-13px;top:50%;width:26px;height:26px;margin-top:-13px;border-radius:50%;border:0;background:var(--surface-hi);box-shadow:var(--clay-sm);font-size:14px;font-weight:700;line-height:1;display:grid;place-items:center;color:var(--ink);padding:0}
.mm-ctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mm-ctl button{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface-hi);box-shadow:var(--clay-sm);font-size:18px;font-weight:700;display:grid;place-items:center}
.mm-hint{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--muted);z-index:3;background:color-mix(in oklab,var(--desk) 80%,transparent);padding:4px 10px;border-radius:999px}
.dim{opacity:.18!important}

/* detail panel */
.panel{position:absolute;top:14px;right:14px;bottom:14px;width:min(380px,calc(100% - 28px));background:linear-gradient(180deg,var(--surface-hi),var(--surface));border-radius:22px;box-shadow:var(--clay),0 30px 60px -30px var(--shade);padding:18px;overflow:auto;z-index:4;animation:slide .35s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.panel h3{font-size:20px;margin:6px 0 10px}
.quote{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:inset 0 2px 4px var(--lo);white-space:pre-wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:14px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.xbtn{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:10px;border:0;background:var(--bg);display:grid;place-items:center}
.xbtn svg{width:15px;height:15px}

/* flow */
.flow-wrap{padding:22px}
.lanes{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 26px}
.lane-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.lane-h i{width:12px;height:12px;border-radius:4px}
.fcard{position:relative;z-index:1;background:linear-gradient(180deg,var(--surface-hi),var(--surface));border-radius:14px;box-shadow:var(--clay-sm);padding:10px 12px;border-left:4px solid var(--k);font-size:13.5px;cursor:pointer;border-top:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.fcard .meta{margin-top:6px;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fcard.is-done{opacity:.55}
.fcard.is-done .tx{text-decoration:line-through}
.flow-svg{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}
.flow-svg path{fill:none;stroke:var(--muted);stroke-width:2;opacity:.55}
.step-n{position:absolute;left:-10px;top:-10px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center}

/* actions */
.owners{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:16px;padding:20px;align-items:start}
.ocol{display:flex;flex-direction:column;gap:16px;min-width:0}
.owner{background:var(--surface);border-radius:20px;box-shadow:var(--clay-sm);padding:16px 16px 6px}
.owner.unassigned{box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--todo) 55%,transparent),var(--clay-sm)}
.owner h3{font-size:17px;display:flex;align-items:center;gap:10px;margin:0 0 6px;padding-bottom:12px;border-bottom:2px solid var(--line);text-wrap:nowrap}
.owner h3 .av{width:32px;height:32px;font-size:12px}
.owner h3 .role{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted)}
.owner h3 .cnt{margin-left:auto;font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);padding:3px 9px;border-radius:999px}
.act{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.act .check{margin-top:1px}
.act:first-of-type{border-top:0}
.act .tx{font-size:14px}
.act .meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;line-height:1.2}
.act .when{font-size:12px;color:var(--muted);margin-top:5px}
.act.is-done .tx{text-decoration:line-through;color:var(--muted)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--surface-hi);display:grid;place-items:center;padding:0;flex:none}
.check svg{width:13px;height:13px;opacity:0}
.check[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff}
.check[aria-pressed="true"] svg{opacity:1}
.due{color:var(--todo);font-weight:700}

/* tasks: kanban, grid, list */
.seg-ic button{display:inline-flex;align-items:center;gap:6px}
.seg-ic svg{width:14px;height:14px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;padding:18px;overflow-x:auto;align-items:start}
.kcol{background:color-mix(in oklab,var(--desk) 60%,var(--bg));border-radius:20px;padding:12px;min-height:240px;box-shadow:inset 0 1px 3px var(--lo);transition:box-shadow .15s,background .15s}
.kcol.over{background:color-mix(in oklab,var(--teal) 10%,var(--bg));box-shadow:inset 0 0 0 2px var(--teal)}
.kh{display:flex;align-items:center;gap:8px;padding:4px 4px 0}
.kh i{width:12px;height:12px;border-radius:4px}
.kh b{font-family:var(--f-display);font-size:17px}
.kh .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);padding:2px 9px;border-radius:999px}
.kh-hint{margin:2px 4px 10px;font-size:12px;color:var(--muted)}
.kbody{display:flex;flex-direction:column;gap:10px}
.kempty{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;font-size:13px;color:var(--muted)}
.tcard{background:linear-gradient(180deg,var(--surface-hi),var(--surface));border-radius:14px;box-shadow:var(--clay-sm);padding:12px;border-left:4px solid var(--k);display:flex;flex-direction:column;gap:9px}
.tcard[draggable="true"]{cursor:grab}
.tcard.dragging{opacity:.4}
.tcard.is-done{opacity:.6}
.tcard.is-done .tx{text-decoration:line-through}
.tc-top{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start}
.tc-top .tx{font-size:14px;line-height:1.4}
.tc-tags{display:flex;gap:6px;flex-wrap:wrap;padding-left:32px}

    msgs.push({id:msgs.length+1, t:new Date(y,mo-1,d,h,+mi,+(s||0)), author:r.author, text:clean, media});
  });
  return msgs;
}

/* ---------- on-device analysis ---------- */
function detectKind(text){ if (!text) return null; for (const k of ["decision","risk","request","task"]) if (KIND_RE[k].test(text)) return k; return null; }
function localAnalyze(msgs){
  const people = [...new Set(msgs.map(m=>m.author))];
  const firsts = people.map(p=>[baseName(p).toLowerCase(),p]);
  const assign = {};
  msgs.forEach((m,i)=>{
    let best=null, score=0;
    if (m.text) DEFS.forEach(d=>{ const s = (m.text.match(d.re)||[]).length*d.w; if (s>score){score=s;best=d.key} });
    if (!best){
      const prevSame = msgs.slice(0,i).reverse().find(p=>p.author===m.author);
      const prev = (prevSame && m.t-prevSame.t < 20*60e3) ? prevSame : (i>0 && m.t-msgs[i-1].t < 20*60e3 ? msgs[i-1] : null);
      best = prev ? assign[prev.id] : "general";
    }
    assign[m.id] = best;
  });
  const threads = [...DEFS,{key:"general",name:"General"}].map(d=>({key:d.key, name:d.name, ids:msgs.filter(m=>assign[m.id]===d.key).map(m=>m.id)}))
    .filter(t=>t.ids.length).sort((a,b)=>b.ids.length-a.ids.length);
  threads.forEach((t,i)=>t.color = TCOL[i%TCOL.length]);
  const items = [];
  msgs.forEach(m=>{
    const kind = detectKind(m.text); if (!kind) return;
    let owner = "";
    if (kind==="task"||kind==="decision") owner = m.author;
    if (kind==="request"){ const hit = firsts.find(([f,p])=>p!==m.author && f.length>1 && new RegExp("\\b"+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(m.text)); owner = hit ? hit[1] : ""; }
    const due = ((m.text.match(DUE_RE)||[])[0] || "").replace(/^(by|on|until) /i,"");
    items.push({id:m.id, kind, text:m.text.length>160?m.text.slice(0,157)+"…":m.text, owner, due});
  });
  const c = k => items.filter(i=>i.kind===k).length;
  const summary = `${msgs.length} messages from ${people.length} people, ${fmtShort(msgs[0].t)} to ${fmtShort(msgs[msgs.length-1].t)}. ${c("request")+c("task")} things to do, ${c("decision")} decisions made and ${c("risk")} risks raised, across ${threads.length} topics.`;
  return {source:"local", summary, threads, items};
}
function entitiesFor(ids){
  const map = new Map();
  ids.forEach(id=>{ const m = byId(id); if (!m?.text) return; ENT_RE.forEach(e=>{ if (e.re.test(m.text)){ const k = e.label; const v = map.get(k) || {label:k[0].toUpperCase()+k.slice(1), ids:[]}; v.ids.push(id); map.set(k,v); } }); });
  return [...map.values()].sort((a,b)=>b.ids.length-a.ids.length).slice(0,6);
}

/* ---------- state ---------- */
const state = {name:SAMPLE_NAME, sample:true, msgs:[], an:null, view:"map", done:{}, collapsed:{}, show:{todo:true,done:true,risk:true,brand:true}, sel:null, flowThread:null, q:"", view0:null, layout:"kanban", sort:"date", sortDir:1};
try{ const l = localStorage.getItem("threadline3.layout"); if (l) state.layout = l; }catch(e){}

function load(raw, name, isSample){
  const msgs = parseChat(raw); if (!msgs.length) return false;
  Object.assign(state,{msgs, name, sample:!!isSample, sel:null, flowThread:null, collapsed:{}, foldInit:false, q:""});
  const saved = store.get("analysis");
  state.an = (saved && saved.key===chatKey()) ? saved.an : localAnalyze(msgs);
  state.done = store.get("done:"+chatKey()) || {};

}
const byId = id => state.msgs[id-1];
const threadOf = id => state.an.threads.find(t=>t.ids.includes(id));
function people(){
  const map = {}; state.msgs.forEach(m=>{ (map[m.author] ||= {name:m.author,n:0}).n++; });
  return Object.values(map).sort((a,b)=>b.n-a.n).map((p,i)=>({...p, color:PCOL[i%PCOL.length]}));
}

/* ---------- mind map ---------- */
function buildTree(){
  const an = state.an;
  const root = {id:"root", kind:"root", children:[]};
  an.threads.forEach(t=>{
    const tn = {id:"t:"+t.key, kind:"thread", t, children:[]};
    GROUPS.forEach(g=>{
      if (!state.show[g.key]) return;
      let kids;
      if (g.key==="brand") kids = entitiesFor(t.ids).map(e=>({id:`e:${t.key}:${e.label}`, kind:"entity", e, t}));
      else kids = an.items.filter(i=>t.ids.includes(i.id) && groupOf(i)===g.key).map(i=>({id:"i:"+i.id, kind:"item", i, t}));
      if (!kids.length) return;
      tn.children.push({id:`g:${t.key}:${g.key}`, kind:"group", g, t, count:g.key==="todo"?kids.filter(k=>!state.done[k.i.id]).length:kids.length, total:kids.length, children:kids});
    });
    root.children.push(tn);
  });
  return root;
}
const GAPX = [0, 70, 46, 40];
function nodeHTML(n){
  const tog = (n.children?.length && n.kind!=="root") ? `<span class="tog" aria-hidden="true">${state.collapsed[n.id]?"+":"−"}</span>` : "";
  if (n.kind==="group"){
    const owners = [...new Set(n.children.filter(k=>k.i && !state.done[k.i.id] && k.i.owner).map(k=>k.i.owner))].slice(0,3);
    return `<button class="node n-group side-${n.side}" data-id="${n.id}" data-toggle="${n.id}" aria-expanded="${!state.collapsed[n.id]}"><span class="sw" style="background:var(--${n.g.color})"></span><b>${n.g.label}</b>${owners.map(avatar).join("")}<span class="cnt">${n.g.key==="todo"?`${n.count} open`:n.total}</span>${tog}</button>`;
  }
  if (n.kind==="root") return `<div class="node n-root" data-id="root"><div class="eyebrow" style="color:#fff;opacity:.8">Project</div><h3>${esc(state.name)}</h3><small>${state.msgs.length} messages · ${people().length} people</small></div>`;
  if (n.kind==="thread") return `<button class="node n-thread side-${n.side}" data-id="${n.id}" data-toggle="${n.id}" style="--c:var(--${n.t.color})" aria-expanded="${!state.collapsed[n.id]}"><h3>${esc(n.t.name)}</h3><small>${n.t.ids.length} message${n.t.ids.length===1?"":"s"}</small>${tog}</button>`;
  if (n.kind==="entity") return `<button class="node n-entity ${state.sel===n.id?"sel":""}" data-id="${n.id}" data-sel="${n.id}"><span class="sw" style="width:10px;height:10px;border-radius:3px;background:var(--brand)"></span>${esc(n.e.label)}<span class="cnt">${n.e.ids.length}×</span></button>`;
  const i = n.i, m = byId(i.id), d = !!state.done[i.id];
  return `<button class="node n-item ${d?"is-done":""} ${state.sel===n.id?"sel":""}" data-id="${n.id}" data-sel="${n.id}" style="--k:var(--${TYPE_COLOR[i.kind]})"><div class="tx">${esc(i.text)}</div>
    <div class="meta">${i.owner?avatar(i.owner)+esc(baseName(i.owner)):`<span>${esc(baseName(m.author))} asked</span>`}${i.due?` · <span class="due">${esc(i.due)}</span>`:""}${d?` · <span class="tag t-done">Done</span>`:""}</div></button>`;
}
function drawMap(animate){
  const vp = $("#mm"); if (!vp) return;
  const world = $("#world"), tree = buildTree();
  if (!state.foldInit){ tree.children.forEach(t=>t.children.forEach(g=>state.collapsed[g.id] = 1)); state.foldInit = true; }
  // balance topics on both sides of the project by size
  let wl = 0, wr = 0;
  tree.children.forEach(t=>{ const w = 1 + t.children.length; if (wr <= wl){ t.side = "r"; wr += w; } else { t.side = "l"; wl += w; } });
  const vis = [];
  (function walk(n, depth, parent){ n.depth = depth; n.parent = parent; if (parent && parent.kind!=="root") n.side = parent.side; vis.push(n); if (!state.collapsed[n.id]) (n.children||[]).forEach(c=>walk(c, depth+1, n)); })(tree, 0, null);
  world.innerHTML = `<svg id="wires"></svg>` + vis.map(nodeHTML).join("");
  const el = {}; world.querySelectorAll(".node").forEach(e=>el[e.dataset.id]=e);
  vis.forEach(n=>{ n.h = el[n.id].offsetHeight; n.w = el[n.id].offsetWidth; });
  // x: distance from the root's edge, per depth
  const colW = [0,0,0,0]; vis.forEach(n=>{ colW[n.depth] = Math.max(colW[n.depth], n.w); });
  const off = [0]; for (let d=1; d<4; d++) off[d] = (d===1 ? tree.w/2 : off[d-1] + colW[d-1]) + GAPX[d];
  const GAP = [0, 22, 12, 10];
  const sides = {l:0, r:0};
  function place(n){
    const kids = state.collapsed[n.id] ? [] : (n.children||[]);
    if (!kids.length){ n.y = sides[n.side]; sides[n.side] += n.h + (GAP[Math.min(3,n.depth)]||10); return; }
    kids.forEach(place);
    const a = kids[0], b = kids[kids.length-1];
    n.y = Math.max((a.y + a.h/2 + b.y + b.h/2)/2 - n.h/2, 0);
    if (n.kind==="thread") sides[n.side] += 16;
  }
  tree.children.forEach(place);
  const Hs = Math.max(sides.l, sides.r, tree.h + 40);
  ["l","r"].forEach(s=>{ const shift = (Hs - sides[s]) / 2; vis.forEach(n=>{ if (n.side===s) n.y += shift; }); });
  tree.y = Hs/2 - tree.h/2;
  vis.forEach(n=>{ if (n.kind==="root") n.x = -n.w/2; else if (n.side==="r") n.x = off[n.depth]; else n.x = -off[n.depth] - n.w; });
  const minX = Math.min(...vis.map(n=>n.x)) - 30, maxX = Math.max(...vis.map(n=>n.x + n.w)) + 30;
  vis.forEach(n=>n.x -= minX);
  const W = maxX - minX, H = Hs + 20;
  world.style.width = W+"px"; world.style.height = H+"px";
  vis.forEach((n,k)=>{ const e = el[n.id]; e.style.left = n.x+"px"; e.style.top = n.y+"px";
    if (animate && !STILL){ e.classList.add("reveal"); e.style.setProperty("--d", (n.depth*160 + Math.min(k,60)*10)+"ms"); } });
  const svg = $("#wires"); svg.setAttribute("width",W); svg.setAttribute("height",H);
  svg.innerHTML = vis.filter(n=>n.parent).map(n=>{
    const p = n.parent, right = n.side==="r", tg = p.kind!=="root" ? 14 : 0;
    const x1 = right ? p.x + p.w + tg : p.x - tg, y1 = p.y + p.h/2, x2 = right ? n.x : n.x + n.w, y2 = n.y + n.h/2, dx = (x2-x1)*.55;
    const col = n.kind==="item" ? `var(--${TYPE_COLOR[n.i.kind]})` : n.kind==="entity" ? "var(--brand)" : `var(--${n.t.color})`;
    return `<path pathLength="100" class="${animate&&!STILL?"grow":""}" style="--d:${n.depth*160}ms" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" stroke="${col}" stroke-width="${[0,5,3.2,2][n.depth]||2}" opacity="${n.depth===3?.7:.9}"/>`;
  }).join("");
  state.mapSize = {W,H};
  if (!state.view0) fitMap(); else applyView();
}
function applyView(){ const v = state.view0, w = $("#world"); if (w && v) w.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.s})`; }
function fitMap(){
  const vp = $("#mm"); if (!vp || !state.mapSize) return;
  const {W,H} = state.mapSize, pad = vp.clientWidth < 600 ? 20 : 60, side = state.sel && vp.clientWidth > 900 ? 400 : 0, pw = vp.clientWidth - pad - side, ph = vp.clientHeight - 60;
  const s = Math.max(.18, Math.min(1, pw/W, ph/H));
  state.view0 = {s, x:pad/2 + Math.max(0,(pw - W*s)/2), y:30 + Math.max(0,(ph - H*s)/2)}; applyView();
}
function zoomAt(f, cx, cy){
  const v = state.view0; const s = Math.max(.25, Math.min(2.2, v.s*f));
  v.x = cx - (cx - v.x)*(s/v.s); v.y = cy - (cy - v.y)*(s/v.s); v.s = s; applyView();
}
function bindPan(){
  const vp = $("#mm"); if (!vp) return; let drag = null;
  vp.addEventListener("pointerdown", e=>{ if (e.target.closest(".node,.mm-ctl,.panel")) return; drag = {x:e.clientX, y:e.clientY, vx:state.view0.x, vy:state.view0.y}; vp.classList.add("grabbing"); vp.setPointerCapture(e.pointerId); });
  vp.addEventListener("pointermove", e=>{ if (!drag) return; state.view0.x = drag.vx + e.clientX - drag.x; state.view0.y = drag.vy + e.clientY - drag.y; applyView(); });
  const end = () => { drag = null; vp.classList.remove("grabbing"); };
  vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
  vp.addEventListener("wheel", e=>{ if (e.target.closest(".panel")) return; e.preventDefault(); const r = vp.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:1/1.1, e.clientX-r.left, e.clientY-r.top); }, {passive:false});
}

function vFlow(){

    ${ents.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px"><span class="eyebrow" style="align-self:center">Relates to</span>${ents.map(e=>`<span class="tag t-brand">${esc(e.label)} · ${e.ids.length}</span>`).join("")}</div>`:""}

      ${its.map((i,n)=>{const m=byId(i.id), d=!!state.done[i.id]; return `<button class="fcard ${d?"is-done":""} reveal" data-fl="${n}" data-flowsel="${i.id}" style="grid-column:${lanes.findIndex(x=>x[0]===i.kind)+1};grid-row:${n+2};--k:var(--${TYPE_COLOR[i.kind]});--d:${n*70}ms"><span class="step-n">${n+1}</span><div class="tx">${esc(i.text)}</div><div class="meta">${avatar(m.author)}${esc(baseName(m.author))} · ${fmtShort(m.t)} ${fmtTime(m.t)}${i.due?` · <span class="due">${esc(i.due)}</span>`:""}${d?` · <span class="tag t-done">Done</span>`:""}</div></button>`}).join("") || `<p class="muted" style="grid-column:1/-1">No decisions, asks or risks in this topic yet.</p>`}
      <svg class="flow-svg" id="flowsvg"></svg>
    </div></div></section>`;
}
function drawFlowArrows(){
  const box = $("#lanes"), svg = $("#flowsvg"); if (!box || !svg) return;
  const r0 = box.getBoundingClientRect(); const cards = [...box.querySelectorAll(".fcard")];
  svg.setAttribute("width", r0.width); svg.setAttribute("height", r0.height);
  let out = `<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
  for (let k=0;k<cards.length-1;k++){
    const a = cards[k].getBoundingClientRect(), b = cards[k+1].getBoundingClientRect();
    const x1 = a.left - r0.left + a.width/2, y1 = a.bottom - r0.top, x2 = b.left - r0.left + b.width/2, y2 = b.top - r0.top;
    const my = y1 + (y2 - y1)/2, r = Math.min(10, Math.abs(x2-x1)/2, (y2-y1)/4), dir = Math.sign(x2-x1);
    out += Math.abs(x2-x1) < 4 ? `<path d="M${x1},${y1} V${y2-3}" marker-end="url(#ah)"/>`
      : `<path d="M${x1},${y1} V${my-r} Q${x1},${my} ${x1+dir*r},${my} H${x2-dir*r} Q${x2},${my} ${x2},${my+r} V${y2-3}" marker-end="url(#ah)"/>`;
  }
  svg.innerHTML = out;
}

function taskItems(){ return state.an.items.filter(i=>state.show[groupOf(i)] && !(state.hideDone && state.done[i.id])); }
const topicTag = t => `<span class="tag" style="background:color-mix(in oklab,var(--${t.color}) 22%,transparent)">${esc(t.name)}</span>`;
function taskCard(i, cls=""){

function vPeople(){

/* ---------- chat + send ---------- */
function vChat(){
  const q = state.q.toLowerCase(), kind = {}; state.an.items.forEach(i=>kind[i.id]=i.kind);
  let last = ""; const rows = [];
  state.msgs.filter(m=>!q || m.text.toLowerCase().includes(q) || m.author.toLowerCase().includes(q)).forEach(m=>{
    const d = fmtDay(m.t); if (d!==last){ rows.push(`<div class="daysep">${d}</div>`); last = d; }
    const t = threadOf(m.id);
    rows.push(`<div class="msg" id="m${m.id}" style="--c:var(--${t?.color||"plum"})"><div><div class="who">${esc(m.author)}</div><div class="when mono">${fmtTime(m.t)}</div></div><div style="min-width:0"><div class="what">${esc(m.text)}${m.media?` <span class="muted">${ICON.cam} photo</span>`:""}</div><div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">${t?`<span class="tag" style="background:color-mix(in oklab,var(--${t.color}) 22%,transparent)">${esc(t.name)}</span>`:""}${kind[m.id]?`<span class="tag ${TYPE_CLASS[kind[m.id]]}">${TYPE_LABEL[kind[m.id]]}</span>`:""}</div></div></div>`);

  return `<section class="desk"><div class="pad"><div class="muted" style="font-size:13px;margin-bottom:6px">${state.q?`${n} message${n===1?"":"s"} match “${esc(state.q)}” · <button class="link" data-act="clearq">Clear search</button>`:`${state.msgs.length} messages, newest last`}</div>${rows.join("") || `<p class="muted">No messages match. Try a shorter word.</p>`}</div></section>`;
}
function outText(k){
  const an = state.an, open = an.items.filter(isOpen), list = (a,f) => a.length ? a.map(f).join("\n") : "• None";
  const dueOf = i => i.due && !i.text.toLowerCase().includes(i.due.toLowerCase()) ? ` (${i.due})` : "";
  const byThread = arr => an.threads.map(t=>{ const its = arr.filter(i=>t.ids.includes(i.id)); return its.length ? `_${t.name}_\n` + its.map(i=>`• ${i.text}${i.owner?` – ${baseName(i.owner)}`:""}${dueOf(i)}`).join("\n") : ""; }).filter(Boolean).join("\n\n") || "• None";
  if (k==="status") return `*${state.name} · status*\n${fmtDay(new Date())}\n\n${an.summary}\n\n*To do, by topic*\n${byThread(open.filter(i=>i.kind!=="risk"))}\n\n*Decided*\n${list(an.items.filter(i=>i.kind==="decision"),i=>`• ${i.text}`)}\n\n*Risks*\n${list(open.filter(i=>i.kind==="risk"),i=>`• ${i.text}`)}`;
  if (k==="plan"){ const by = {}; open.forEach(i=>{ (by[i.owner?baseName(i.owner):"Needs an owner"] ||= []).push(i); });
    return `*Next steps · ${state.name}*\n\n` + Object.entries(by).map(([o,its])=>`*${o}*\n`+its.map(i=>`☐ ${i.text}${dueOf(i)}`).join("\n")).join("\n\n") + `\n\nReply here if anything's missing.`; }
  const dec = an.items.filter(i=>i.kind==="decision");
  return `Hi! A quick update on *${state.name}*.\n\n${dec.length?`Here's what we've confirmed:\n${dec.map(i=>`• ${i.text}`).join("\n")}\n\n`:""}We're working through the open items and will share progress photos as soon as the next step is done.\n\nAny questions, just reply here.`;
}
function vSend(){
  return `<section class="desk"><div class="ogrid">${[["status","Team status","Everything open, grouped by topic."],["plan","Next steps","A checklist per person."],["client","Client update","Decisions and progress. Leaves out internal risks."]]
    .map(([k,t,d])=>`<div class="ocard reveal"><div><h3 style="font-size:18px">${t}</h3><p class="muted" style="margin:2px 0 0;font-size:13px">${d}</p></div><pre id="out-${k}">${esc(outText(k))}</pre><button class="btn wa" data-copy="${k}">Copy for WhatsApp</button></div>`).join("")}</div></section>`;

function openImport(){ Object.assign(imp,{step:1,src:"file",text:"",name:"",msgs:null,err:""}); drawImport(); }
function drawImport(){

  if (imp.step===1) body = `<div class="ways">
      <button class="way" data-src="file" aria-pressed="${imp.src==="file"}"><b>Chat export</b><span>A .zip or .txt from WhatsApp. Best option.</span></button>

    : imp.src==="paste" ? `<textarea id="paste" aria-label="Chat text" placeholder="[27/10/2026, 9:12 AM] Daniel: Morning team…">${esc(imp.text)}</textarea>`
    : `<p class="muted">Live sync works through the WhatsApp Business Platform: a business number, a Meta app and a small server that forwards new messages here. Personal WhatsApp accounts can't connect live. Until it's set up, re-export the chat whenever you want fresh results.</p>`)
    + (imp.err?`<p class="err" role="alert">${esc(imp.err)}</p>`:"");
  else { const m = imp.msgs; body = `<div class="preview"><div><b>${m.length}</b><span>messages</span></div><div><b>${new Set(m.map(x=>x.author)).size}</b><span>people</span></div><div><b>${m.filter(x=>x.media).length}</b><span>photos & files</span></div><div><b>${Math.max(1,Math.round((m[m.length-1].t-m[0].t)/864e5))}</b><span>days</span></div></div>
      <div class="field"><label for="pname" class="eyebrow">Project name</label><input id="pname" value="${esc(imp.name)}" maxlength="60"></div>${imp.err?`<p class="err" role="alert">${esc(imp.err)}</p>`:""}`; }
  modal(`<div style="display:flex;justify-content:space-between;gap:12px"><div><span class="eyebrow">Step ${imp.step} of 2</span><h2>${imp.step===1?"Connect a WhatsApp chat":"Check and name it"}</h2></div><button class="xbtn" style="position:static" data-close aria-label="Close">${ICON.x}</button></div>
    ${body}<div class="mfoot">${imp.step===2?`<button class="btn ghost" data-imp="back">Back</button>`:`<button class="btn ghost" data-act="sample">Use the sample</button>`}
    ${imp.step===1&&imp.src==="paste"?`<button class="btn wa" data-imp="paste">Check messages</button>`:""}${imp.step===2?`<button class="btn wa" data-imp="open">Build the map</button>`:""}</div>
    <p class="privacy">Your chat is read in this browser and kept only on this device.${sampleFn?" It goes to Claude only when you press Sort with Claude.":""}</p>`);
  const drop = $("#drop"), file = $("#file");

    ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
    drop.addEventListener("drop",e=>e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0])); }

async function readFile(f){
  try{
    let text, name = f.name.replace(/\.(txt|zip)$/i,"").replace(/^WhatsApp Chat (with|-)\s*/i,"").trim() || "WhatsApp chat";
    if (/\.zip$/i.test(f.name)){
      if (!window.JSZip){ imp.err = "Zip files can't be opened here. Unzip it and drop the .txt inside."; return drawImport(); }
      const zip = await JSZip.loadAsync(f); const entry = Object.values(zip.files).find(z=>/_chat\.txt$/i.test(z.name)) || Object.values(zip.files).find(z=>/\.txt$/i.test(z.name));
      if (!entry){ imp.err = "That zip has no chat .txt inside. Export the chat again and choose Without media."; return drawImport(); }
      text = await entry.async("string");
    } else text = await f.text();
    checkText(text, name);
  }catch(e){ imp.err = "That file couldn't be read. Try the .txt export instead."; drawImport(); }
}
function checkText(text, name){
  const msgs = parseChat(text);
  if (!msgs.length){ imp.err = "No WhatsApp messages found. Lines should start with a date and time, like [27/10/2026, 9:12 AM] Name: message."; return drawImport(); }
  Object.assign(imp,{step:2, text, name, msgs, err:""}); drawImport(); $("#pname")?.select();
}
function finishImport(){
  const name = ($("#pname")?.value||"").trim(); if (!name){ imp.err = "Give the project a name."; return drawImport(); }
  load(imp.text, name, false); store.set("chat",{text:imp.text,name}); store.del("analysis");
  closeLayer(); state.view0 = null; go("map"); toast(`${state.msgs.length} messages mapped into ${state.an.threads.length} topics`);
}

/* ---------- Claude ---------- */
let sampleFn = null, aiCtl = null;
async function sortWithClaude(){
  if (!sampleFn) return;
  aiCtl = new AbortController();
  const msgs = state.msgs.slice(-700);
  let body = msgs.map(m=>`#${m.id} [${m.t.toISOString().slice(0,16).replace("T"," ")}] ${m.author}: ${m.text?m.text.slice(0,280).replace(/\n/g," "):"(photo)"}`).join("\n");
  if (body.length>150000) body = body.slice(-150000);
  const prompt = `You organise a WhatsApp group chat for a design and build project into a mind map.
Reply with ONLY JSON: {"summary":"2 plain sentences","threads":[{"name":"2-3 word topic","ids":[message numbers]}],"items":[{"id":message number,"kind":"decision|request|task|risk","text":"short rewrite, max 16 words","owner":"person responsible or empty","due":"due date text or empty"}]}
Rules: 3 to 6 topics; each message number in exactly one topic. request = someone asked for something still to do; task = someone committed to do something; decision = something agreed; risk = a problem, delay or defect. Only items the chat supports. Use names exactly as written.

Chat:
${body}`;
  modal(`<div style="display:flex;gap:16px;align-items:center"><span class="spin"></span><div><h2 style="font-size:22px">Claude is sorting ${msgs.length} messages</h2><p class="muted" style="margin:4px 0 0">Grouping topics, tasks, decisions and owners. Usually under a minute.</p></div></div><div class="mfoot"><span></span><button class="btn" data-close>Stop</button></div>`);
  try{
    const r = await sampleFn.json(prompt, {signal:aiCtl.signal});
    const valid = new Set(state.msgs.map(m=>m.id)), seen = new Set();
    const threads = (r.threads||[]).slice(0,6).map((t,i)=>{ const ids = (t.ids||[]).map(Number).filter(id=>valid.has(id)&&!seen.has(id)); ids.forEach(id=>seen.add(id)); return {key:"c"+i, name:String(t.name||"Topic "+(i+1)), ids}; }).filter(t=>t.ids.length);
    const rest = state.msgs.filter(m=>!seen.has(m.id)).map(m=>m.id); if (rest.length) threads.push({key:"cx", name:"Other", ids:rest});
    threads.sort((a,b)=>b.ids.length-a.ids.length).forEach((t,i)=>t.color = TCOL[i%TCOL.length]);
    const items = (r.items||[]).filter(i=>valid.has(Number(i.id)) && ["decision","request","task","risk"].includes(i.kind)).map(i=>({id:Number(i.id),kind:i.kind,text:String(i.text||""),owner:String(i.owner||""),due:String(i.due||"")}));
    if (!threads.length) throw {code:"invalid_json"};
    state.an = {source:"claude", summary:String(r.summary||state.an.summary), threads, items};
    store.set("analysis",{key:chatKey(), an:state.an}); aiCtl = null; closeLayer(); state.view0 = null; render(true); toast("Claude re-sorted the map");
  }catch(e){
    aiCtl = null; if (e?.code==="cancelled") return; closeLayer();
    toast({not_granted:"Claude wasn't allowed for this page.",rate_limited:"Too many requests. Try again in a few minutes.",invalid_json:"Claude's answer couldn't be read. Try again."}[e?.code] || "Claude couldn't finish. Try again.");
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)){ sampleFn = null; render(); }
  }
}

/* ---------- events ---------- */
let tT; function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tT); tT = setTimeout(()=>el.hidden = true, 2600); }
document.addEventListener("click", e=>{
  if (e.target.matches("[data-close]") || e.target.closest("button[data-close]")) return closeLayer();
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.view) return go(d.view);
  if (d.act==="import") return openImport();
  if (d.act==="claude") return sortWithClaude();
  if (d.act==="sample"){ store.del("chat"); store.del("analysis"); load(SAMPLE,SAMPLE_NAME,true); closeLayer(); state.view0 = null; return go("map"); }
  if (d.act==="unsel"){ state.sel = null; return render(); }
  if (d.act==="expand"){ state.collapsed = {}; state.foldInit = true; state.view0 = null; return render(true); }
  if (d.act==="showall"){ GROUPS.forEach(g=>state.show[g.key] = true); state.view0 = null; return render(); }
  if (d.layout){ state.layout = d.layout; try{ localStorage.setItem("threadline3.layout", d.layout); }catch(e){} return render(true); }
  if (d.sort){ if (state.sort===d.sort) state.sortDir *= -1; else { state.sort = d.sort; state.sortDir = 1; } return render(); }
  if (d.act==="hidedone"){ state.hideDone = d.v==="1"; return render(); }
  if (d.act==="clearq"){ state.q = ""; return render(); }
  if (d.act==="collapse"){ state.collapsed = {}; state.foldInit = false; state.view0 = null; return render(true); }
  if (d.src){ imp.src = d.src; imp.err = ""; return drawImport(); }
  if (d.imp==="paste") return imp.text.trim() ? checkText(imp.text,"Pasted chat") : (imp.err = "Paste a few lines of the chat first.", drawImport());
  if (d.imp==="back"){ imp.step = 1; return drawImport(); }
  if (d.imp==="open") return finishImport();
  if (d.zoom){ const vp = $("#mm"); if (d.zoom==="fit") return fitMap(); return zoomAt(d.zoom==="in"?1.2:1/1.2, vp.clientWidth/2, vp.clientHeight/2); }
  if (d.show){ state.show[d.show] = !state.show[d.show]; return render(); }
  if (d.only){ const already = state.view==="map" && GROUPS.every(g=>state.show[g.key]===(g.key===d.only));
    GROUPS.forEach(g=>state.show[g.key] = already ? true : g.key===d.only); if (!already) state.collapsed = Object.fromEntries(Object.entries(state.collapsed).filter(([k])=>!k.startsWith("g:"))), state.foldInit = true;
    state.view0 = null; if (state.view!=="map") return go("map"); return render(true); }
  if (d.toggle){ state.collapsed[d.toggle] ? delete state.collapsed[d.toggle] : state.collapsed[d.toggle] = 1; state.view0 = null; return render(); }
  if (d.sel){ state.sel = state.sel===d.sel ? null : d.sel; document.querySelectorAll(".n-item.sel,.n-entity.sel").forEach(x=>x.classList.remove("sel")); if (state.sel) b.classList.add("sel"); return drawDetail(); }
  if (d.done){ const id = d.done; state.done[id] ? delete state.done[id] : state.done[id] = 1; store.set("done:"+chatKey(), state.done); const y = scrollY; render(); scrollTo(0,y); return toast(state.done[id] ? "Marked done" : "Marked open"); }
  if (d.flow){ state.flowThread = d.flow; return render(true); }
  if (d.flowsel){ state.sel = "i:"+d.flowsel; return go("map"); }
  if (d.chatfor){ const m = byId(+d.chatfor); state.q = m.text.slice(0,24); return go("chat"); }
  if (d.copy){ const text = outText(d.copy), el = $("#out-"+d.copy);
    return navigator.clipboard.writeText(text).then(()=>toast("Copied. Paste it into WhatsApp")).catch(()=>{ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text selected. Press Ctrl+C to copy"); }); }
});
/* kanban drag and drop: Done marks an item done; To do or Risks reopens it */
let dragId = null;
document.addEventListener("dragstart", e=>{ const c = e.target.closest?.(".tcard[draggable]"); if (!c) return; dragId = c.dataset.tid; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try{ e.dataTransfer.setData("text/plain", dragId); }catch(_){} });
document.addEventListener("dragend", e=>{ e.target.closest?.(".tcard")?.classList.remove("dragging"); document.querySelectorAll(".kcol.over").forEach(k=>k.classList.remove("over")); });
document.addEventListener("dragover", e=>{ const col = e.target.closest?.(".kcol"); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll(".kcol.over").forEach(k=>k!==col && k.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", e=>{
  const col = e.target.closest?.(".kcol"); if (!col || !dragId) return; e.preventDefault();
  const id = dragId; dragId = null; const it = state.an.items.find(x=>x.id===+id); if (!it) return;
  const to = col.dataset.col;
  if (to==="decided") return toast("Decisions come from the chat. Drag to Done to finish an item.");
  if (to==="donecol") state.done[id] = 1;
  else if ((to==="todo" && groupOf(it)==="todo") || (to==="risk" && it.kind==="risk")) delete state.done[id];
  else return toast(`That item belongs in ${it.kind==="risk"?"Risks":"To do"}.`);
  store.set("done:"+chatKey(), state.done); render(); toast(state.done[id] ? "Moved to Done" : "Reopened");
});
document.addEventListener("input", e=>{ if (e.target.id!=="search") return; state.q = e.target.value; const p = e.target.selectionStart; render(); const s = $("#search"); s.focus(); s.setSelectionRange(p,p); });
document.addEventListener("keydown", e=>{ if (e.key==="Escape"){ if ($("#layer").innerHTML) closeLayer(); else if (state.sel){ state.sel = null; drawDetail(); } } if (e.key==="Enter" && e.target.id==="pname") finishImport(); });
let rT; addEventListener("resize", ()=>{ clearTimeout(rT); rT = setTimeout(()=>{ if (state.view==="map"){ state.view0 = null; drawMap(false); } if (state.view==="flow") drawFlowArrows(); if (state.view==="actions") render(); }, 150); });

/* ---------- start ---------- */
const saved = store.get("chat");
if (!(saved && load(saved.text, saved.name, false))) load(SAMPLE, SAMPLE_NAME, true);
const h = (location.hash||"").slice(1); if (["map","flow","actions","chat","send"].includes(h)) state.view = h;
if (PARAMS.get("expand")){ state.foldInit = true; buildTree().children.forEach(t=>t.children.forEach(g=>state.collapsed[g.id] = 1)); PARAMS.get("expand").split(",").forEach(id=>delete state.collapsed[id]); }
if (PARAMS.get("sel")) state.sel = PARAMS.get("sel");
if (PARAMS.get("flow")) state.flowThread = PARAMS.get("flow");
if (["kanban","list","grid","people"].includes(PARAMS.get("layout"))) state.layout = PARAMS.get("layout");
render(true);
if (PARAMS.get("open")==="import") openImport();
document.fonts?.ready.then(()=>{ if (state.view==="map"){ state.view0 = null; drawMap(false); } if (state.view==="flow") drawFlowArrows(); });
(async()=>{ try{ sampleFn = await window.claude?.use?.("sample"); }catch(e){ sampleFn = null; } if (sampleFn) document.querySelectorAll('[data-act="claude"]').forEach(b=>b.hidden=false); })();
</script>

</body></html>
