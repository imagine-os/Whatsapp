<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Turn a WhatsApp project chat into threads, decisions, open asks and risks."><meta property="og:title" content="Threadline"><meta property="og:description" content="Turn a WhatsApp project chat into threads, decisions, open asks and risks."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Threadline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Signal orbit. A slim nav rail, then a deep-green stage: activity pulse on top, people orbiting the project core, action cards beneath. Single dark look by design. */
:root{
  --bg:#020D09; --bg2:#04140E; --panel:rgba(6,32,22,.62); --panel-solid:#071D15; --line:rgba(37,255,148,.18); --line-strong:rgba(37,255,148,.38);
  --fg:#DFFFEF; --muted:#7FAF97; --dim:#4E7A65;
  --signal:#25FF94; --lime:#C8FF50; --cyan:#5CE1E6; --amber:#FFC24B; --coral:#FF7A5C; --violet:#B794F6;
  --on-signal:#02140C;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif; --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(900px 600px at 60% 40%,rgba(37,255,148,.07),transparent 70%),var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:8px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--signal)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}

/* app shell */
.app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;border-right:1px solid var(--line);background:rgba(2,13,9,.7)}
.logo{width:44px;height:44px;border-radius:50%;margin-bottom:18px;background:radial-gradient(circle at 35% 30%,#C9FFE3,var(--signal) 50%,#0A6B3E);box-shadow:0 0 24px rgba(37,255,148,.6);position:relative}
.logo::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid var(--line-strong);transform:rotateX(70deg)}
.nav{border:0;background:none;width:72px;padding:10px 4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}
.nav svg{width:22px;height:22px}
.nav:hover{color:var(--fg);background:rgba(37,255,148,.06)}
.nav[aria-current="page"]{color:var(--signal);background:rgba(37,255,148,.1);box-shadow:inset 0 0 0 1px var(--line)}
.rail .spacer{flex:1}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px),2.4vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.4vw);padding-block:22px 48px}

/* top bar */
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(26px,3.4vw,38px);line-height:1.05;letter-spacing:.01em}
.top .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:7px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px var(--signal)}
.sync.sample i{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.top .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:rgba(37,255,148,.06);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:background .15s,transform .15s}
.btn:hover{background:rgba(37,255,148,.14)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.primary{background:linear-gradient(180deg,#E2FF8A,var(--lime));border-color:transparent;color:var(--on-signal);box-shadow:0 0 24px rgba(200,255,80,.25)}
.btn.primary:hover{background:linear-gradient(180deg,#EDFFAE,#D6FF6E)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:rgba(37,255,148,.06)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px)}
.ph{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}

/* onboarding strip */
.guide{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr)) auto;gap:18px;align-items:center;padding:16px 20px;margin-bottom:20px;border-color:rgba(255,194,75,.35);background:linear-gradient(90deg,rgba(255,194,75,.08),rgba(6,32,22,.6))}
.guide .lbl{color:var(--amber)}
.step{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--muted)}
.step b{display:block;color:var(--fg);font-size:14px}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--f-display);color:var(--signal)}
.step.done .n{background:var(--signal);color:var(--on-signal);border-color:transparent}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--coral)}
.kpi .bar{height:4px;border-radius:3px;background:rgba(37,255,148,.12);margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--signal);box-shadow:0 0 10px var(--signal)}

/* pulse */
.pulse{position:relative;padding:16px 18px 10px;margin-bottom:18px}
.pulse svg{display:block;width:100%;height:110px}
.pulse .days{position:relative;height:18px;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.pulse .days span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tip{position:absolute;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}

/* orbit */
.orbitwrap{position:relative;overflow:hidden;margin-bottom:18px}
.orbit{position:relative;width:100%}
.ring{position:absolute;border-radius:50%;border:1px solid var(--line);transform:translate(-50%,-50%);transition:border-color .2s}
.ring.hot{border-color:var(--line-strong);box-shadow:0 0 30px rgba(37,255,148,.08)}
.core{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 30%,#C9FFE3,var(--signal) 45%,#0A6B3E);box-shadow:0 0 70px rgba(37,255,148,.55);color:var(--on-signal);font-family:var(--f-display);font-weight:600;line-height:1.1;padding:8px}
.core small{display:block;font-size:11px;letter-spacing:.14em;opacity:.75}
.planet{position:absolute;left:0;top:0;border:0;padding:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;will-change:transform}
.planet .ball{border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:var(--on-signal);background:radial-gradient(circle at 35% 30%,#F4FFF9,var(--pc) 58%,color-mix(in oklab,var(--pc) 55%,black));box-shadow:0 0 26px color-mix(in oklab,var(--pc) 70%,transparent);transition:transform .2s}
.planet:hover .ball,.planet:focus-visible .ball{transform:scale(1.12)}
.planet .nm{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#A9FFD2;white-space:nowrap}
.planet .dot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 10px var(--coral);border:2px solid var(--bg)}
.orbit-legend{position:absolute;left:18px;bottom:14px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.orbit-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.orbit-hint{position:absolute;right:18px;top:14px;font-size:12px;color:var(--dim)}

/* cards grid */
.grid3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:14px}
.card{padding:18px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{font-size:14px}
.item .s{font-size:12px;color:var(--muted);margin-top:2px}
.kind{display:inline-block;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.k-risk{color:var(--coral)} .k-request{color:var(--cyan)} .k-task{color:var(--amber)} .k-decision{color:var(--signal)}
.check{width:22px;height:22px;border-radius:7px;border:1px solid var(--line-strong);background:none;display:grid;place-items:center;padding:0;flex:none}
.check svg{width:14px;height:14px;opacity:0}
.check:hover{background:rgba(37,255,148,.12)}
.check[aria-pressed="true"]{background:var(--signal);border-color:transparent;color:var(--on-signal)}
.check[aria-pressed="true"] svg{opacity:1}
.done-row .t{text-decoration:line-through;color:var(--dim)}
.big{font-family:var(--f-display);font-size:18px;line-height:1.4}
.summary{font-size:16px;line-height:1.6}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

/* threads */
.split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:10px}
.tbtn{text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center;transition:border-color .15s,background .15s}
.tbtn:hover{border-color:var(--line-strong)}
.tbtn[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in oklab,var(--tc) 10%,var(--panel-solid))}
.tbtn i{width:14px;height:14px;border-radius:50%;background:var(--tc);box-shadow:0 0 12px var(--tc)}
.tbtn b{font-family:var(--f-display);font-size:16px;font-weight:600}
.tbtn small{display:block;color:var(--muted);font-size:12px}
.tbtn .c{font-family:var(--f-display);font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);border-radius:999px;padding:4px 12px;font-size:13px;background:none}
button.chip:hover{background:rgba(37,255,148,.1)}
button.chip[aria-pressed="true"]{background:var(--signal);color:var(--on-signal);border-color:transparent}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--on-signal);background:radial-gradient(circle at 35% 30%,#F4FFF9,var(--pc,var(--signal)) 60%)}
.msg .who{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .who b{font-weight:700}
.msg .who .mono{color:var(--dim);font-size:11px}
.msg .what{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.photo{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:8px;padding:2px 8px}
.daysep{font-family:var(--f-display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding:16px 0 4px}

/* board */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.lane{padding:14px;min-width:0}
.lane h3{font-size:15px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:10px}
.lane h3 span{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:0}
.bcard{border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:4px 12px 12px 4px;background:rgba(2,13,9,.55);padding:11px 12px;margin-bottom:10px}
.bcard .t{font-size:14px}
.bcard .f{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
.due{color:var(--amber);font-weight:600}
.bcard.done{opacity:.55}
.bcard.done .t{text-decoration:line-through}

/* people */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{padding:18px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:18px}
.pcard:hover{border-color:var(--line-strong)}
.prow{display:flex;gap:12px;align-items:center}
.prow .av{width:46px;height:46px;font-size:16px}
.meter{height:6px;border-radius:4px;background:rgba(37,255,148,.1);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--pc);box-shadow:0 0 10px var(--pc)}

/* search */
.search{flex:1;min-width:200px;max-width:420px;border:1px solid var(--line-strong);border-radius:12px;padding:10px 14px;background:rgba(2,13,9,.6)}
.search::placeholder{color:var(--dim)}

/* outputs */
.ogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ocard{padding:18px;display:flex;flex-direction:column;gap:12px}
.ocard pre{margin:0;white-space:pre-wrap;font:13.5px/1.6 var(--f-body);background:rgba(2,13,9,.6);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:360px;overflow:auto;flex:1}
.ocard p{margin:0;font-size:13px;color:var(--muted)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(1,8,5,.7);backdrop-filter:blur(6px);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel-solid);border-left:1px solid var(--line-strong);z-index:41;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px 24px;padding-top:max(24px,env(safe-area-inset-top,0px));overflow:auto;box-shadow:-30px 0 60px rgba(0,0,0,.5)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(820px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:22px;z-index:41;padding:26px;box-shadow:0 40px 80px rgba(0,0,0,.6)}
.xbtn{border:1px solid var(--line);background:none;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.xbtn svg{width:16px;height:16px}
.stepper{display:flex;gap:8px;align-items:center;margin:4px 0 20px;font-size:12px;color:var(--dim);font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;flex-wrap:wrap}
.stepper span{display:flex;align-items:center;gap:8px}
.stepper span::after{content:"";width:24px;height:1px;background:var(--line-strong)}
.stepper span:last-child::after{display:none}
.stepper .on{color:var(--signal)}
.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.src{border:1px solid var(--line);border-radius:16px;background:rgba(2,13,9,.5);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.src svg{width:24px;height:24px;color:var(--signal)}
.src b{font-family:var(--f-display);font-size:16px}
.src span{font-size:13px;color:var(--muted)}
.src[aria-pressed="true"]{border-color:var(--signal);background:rgba(37,255,148,.08)}
.drop{border:1.5px dashed var(--line-strong);border-radius:16px;padding:26px;text-align:center;cursor:pointer;display:block;background:rgba(37,255,148,.03)}
.drop.over{background:rgba(37,255,148,.12);border-color:var(--signal)}
.drop b{font-family:var(--f-display);font-size:17px;display:block;margin-bottom:4px}
.howto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.howto ol{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:180px;border:1px solid var(--line-strong);border-radius:14px;background:rgba(2,13,9,.6);padding:12px;font:13px/1.5 var(--f-mono);resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;margin:16px 0}
.field input{border:1px solid var(--line-strong);border-radius:12px;background:rgba(2,13,9,.6);padding:11px 14px}
.preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 14px}
.preview div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.preview b{display:block;font-family:var(--f-display);font-size:22px}
.preview span{font-size:12px;color:var(--muted)}
.err{color:var(--coral);font-size:13px;margin-top:8px}
.mfoot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.privacy{font-size:12px;color:var(--dim);margin-top:14px;display:flex;gap:8px;align-items:center}
.privacy svg{width:14px;height:14px;flex:none}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--lime);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:var(--on-signal);padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}

@media (max-width:1100px){
  .grid3{grid-template-columns:1fr 1fr}
  .grid3 > :first-child{grid-column:1/-1}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ogrid{grid-template-columns:1fr}
  .guide{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:30;background:rgba(2,13,9,.94)}
  .logo,.rail .spacer,.rail .conn{display:none}
  .nav{width:auto;flex:1;padding:6px 2px}
  .main{padding-bottom:96px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi:last-child{grid-column:1/-1}
  .grid3,.split,.sources,.howto{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .guide{grid-template-columns:1fr}
  .preview{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top .acts{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="logo" aria-hidden="true"></div>
    <button class="nav" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><ellipse cx="12" cy="12" rx="9.5" ry="4" transform="rotate(-18 12 12)"/></svg>Orbit</button>

const TCOL = ["signal","lime","cyan","amber","violet","coral"];
const DEFS = [
  {key:"build",name:"Concrete & Site",w:1,words:["concrete","bench","pour","mold","mould","curing","cure","demould","sealing","seal","crack","drain","slab","site","wall","tile","leg","floor","contractor","plumbing","electric"]},
  {key:"furn",name:"Furniture",w:1,words:["chair","chairs","sofa","table","furniture","fabric","boucle","upholstery","rug","courier","lead time","supplier","delivery","samples","lamp","cushion"]},
  {key:"design",name:"Design Direction",w:1,words:["render","palette","plaster","finish","lighting","travertine","deck","presentation","colour","color","mood","drawing","sketch","material","layout","concept"]},
  {key:"money",name:"Budget & Quotes",w:1,words:["quote","budget","cost","price","allowance","invoice","payment","pay","deposit","package","discount"]},
  {key:"time",name:"Schedule",w:.6,words:["monday","tuesday","wednesday","thursday","friday","saturday","sunday","tomorrow","schedule","deadline","moved","next week","timeline","reschedule"]}
];
DEFS.forEach(d=>d.re=new RegExp("\\b("+d.words.map(w=>w.replace(/ /g,"\\s")).join("|")+")\\b","gi"));
const KIND_RE = {
  decision:/\b(approved?|decided|let'?s go with|go with|finali[sz]ed?|final call|confirmed|agreed|signed off|locked in)\b/i,
  risk:/\b(delay(ed|s)?|late|issue|problem|crack(ed|s)?|broken|damaged?|missing|wrong|shortage|behind|stuck|back-?ordered|leak(ing)?|off from)\b/i,
  request:/(\b(can you|could you|please|pls|need you to|send (me|us)|let me know|waiting (on|for))\b|\?\s*$)/i,
  task:/\b(i'?ll|i will|we'?ll|will (send|do|deliver|share|check|call|order|get|fix)|on it|todo|to do)\b/i
};
const DUE_RE = /\b(today|tonight|tomorrow|eod|end of (day|week)|next week|(?:by |on |until )?(?:mon|tues|wednes|thurs|fri|satur|sun)day(?: \d{1,2}(?:am|pm))?|\d{1,2}(?:st|nd|rd|th)? (?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]* \d{1,2})\b/i;
const MEDIA_RE = /<attached:[^>]+>|<media omitted>|\b(image|video|audio|sticker|gif|document) omitted\b|\S+\.(jpe?g|png|webp|mp4|opus|pdf) \(file attached\)/gi;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){try{return JSON.parse(localStorage.getItem("threadline2."+k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem("threadline2."+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem("threadline2."+k)}catch(e){}}
};
const fmtTime = d => d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
const fmtDay = d => d.toLocaleDateString([], {weekday:"short",day:"numeric",month:"short"});
const fmtShort = d => d.toLocaleDateString([], {day:"numeric",month:"short"});
const baseName = n => n.split(/\s+[·|\-–]\s+/)[0].trim() || n;
const initials = n => baseName(n).replace(/[^\p{L}\s]/gu," ").trim().split(/\s+/).slice(0,2).map(p=>p[0]||"").join("").toUpperCase() || "?";
const firstName = n => baseName(n).split(/\s/)[0];
const ago = ms => { const h = ms/36e5; return h<1 ? Math.max(1,Math.round(ms/6e4))+"m" : h<48 ? Math.round(h)+"h" : Math.round(h/24)+"d"; };
const ICON = {
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',

  live:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  cam:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
};

/* ---------- parsing ---------- */
function parseChat(raw){
  const lines = raw.replace(/\r/g,"").replace(/[\u200e\u200f\u202a-\u202e\ufeff]/g,"").replace(/[\u202f\u00a0]/g," ").split("\n");
  const RE_IOS = /^\[(\d{1,4})[\/.\-](\d{1,2})[\/.\-](\d{1,4}),?\s+(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?\s*([ap]\.?\s?m\.?)?\]\s*([^:]{1,60}?):\s?([\s\S]*)$/i;
  const RE_AND = /^(\d{1,4})[\/.\-](\d{1,2})[\/.\-](\d{1,4}),?\s+(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?\s*([ap]\.?\s?m\.?)?\s[-–]\s([^:]{1,60}?):\s?([\s\S]*)$/i;
  const RE_HEAD = /^\[?\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{1,4},?\s+\d{1,2}[:.]\d{2}/;
  const raws = []; let cur = null;
  for (const line of lines){
    const m = line.match(RE_IOS) || line.match(RE_AND);
    if (m){ cur = {p:m.slice(1,8), author:m[8].trim(), text:m[9]}; raws.push(cur); }
    else if (RE_HEAD.test(line)){ cur = null; }
    else if (cur){ cur.text += "\n" + line; }
  }
  let order = "DMY";
  if (raws.some(r=>+r.p[0]>31)) order = "YMD";
  else if (raws.some(r=>+r.p[0]>12)) order = "DMY";
  else if (raws.some(r=>+r.p[1]>12)) order = "MDY";
  const msgs = [];
  raws.forEach(r=>{
    let [a,b,c,h,mi,s,ap] = r.p; let y,mo,d;
    if (order==="YMD"){y=+a;mo=+b;d=+c} else if (order==="MDY"){mo=+a;d=+b;y=+c} else {d=+a;mo=+b;y=+c}
    if (y<100) y+=2000;
    h=+h; if (ap){const pm=/p/i.test(ap); if(pm&&h<12)h+=12; if(!pm&&h===12)h=0;}
    const t = new Date(y,mo-1,d,h,+mi,+(s||0));
    const text = r.text.trim();
    if (/end-to-end encrypted|created (this )?group|changed the (subject|group)|joined using this group|security code changed/i.test(text)) return;
    const media = (text.match(MEDIA_RE)||[]).length > 0;
    const clean = text.replace(MEDIA_RE,"").trim();
    if (!clean && !media) return;
    msgs.push({id:msgs.length+1, t, author:r.author, text:clean, media});
  });
  return msgs;
}

/* ---------- on-device analysis ---------- */
function detectKind(m){ if (!m.text) return null; for (const k of ["decision","risk","request","task"]) if (KIND_RE[k].test(m.text)) return k; return null; }
function localAnalyze(msgs){
  const people = [...new Set(msgs.map(m=>m.author))];
  const firsts = people.map(p=>[firstName(p).toLowerCase(),p]);
  const tally = {}; DEFS.forEach(d=>tally[d.key]={});
  const assign = {};
  msgs.forEach((m,i)=>{
    let best=null,score=0;
    if (m.text) DEFS.forEach(d=>{
      const hits = m.text.match(d.re)||[];
      hits.forEach(h=>{const k=h.toLowerCase(); tally[d.key][k]=(tally[d.key][k]||0)+1});
      const s = hits.length*d.w; if (s>score){score=s;best=d.key}
    });
    if (!best){
      const prevSame = msgs.slice(0,i).reverse().find(p=>p.author===m.author);
      const prev = (prevSame && m.t-prevSame.t < 20*60e3) ? prevSame : (i>0 && m.t-msgs[i-1].t < 20*60e3 ? msgs[i-1] : null);
      best = prev ? assign[prev.id] : "general";
    }
    assign[m.id] = best;
  });
  const threads = [...DEFS,{key:"general",name:"General"}].map(d=>{
    const ids = msgs.filter(m=>assign[m.id]===d.key).map(m=>m.id);
    const subs = Object.entries(tally[d.key]||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([w])=>w[0].toUpperCase()+w.slice(1));
    return {key:d.key,name:d.name,ids,subs};
  }).filter(t=>t.ids.length).sort((a,b)=>b.ids.length-a.ids.length);
  threads.forEach((t,i)=>{ t.color = TCOL[i%TCOL.length]; if(!t.subs.length) t.subs=["Updates"]; });
  const items = [];
  msgs.forEach(m=>{
    const kind = detectKind(m); if (!kind) return;
    let owner = "";
    if (kind==="task"||kind==="decision") owner = m.author;
    if (kind==="request"){ const hit = firsts.find(([f,p])=>p!==m.author && f.length>1 && new RegExp("\\b"+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(m.text)); owner = hit ? hit[1] : ""; }
    const due = (m.text.match(DUE_RE)||[])[0] || "";
    items.push({id:m.id, kind, text:m.text.length>150?m.text.slice(0,147)+"…":m.text, owner, due:due.replace(/^(by|on|until) /i,"")});
  });
  const count = k => items.filter(i=>i.kind===k).length;
  const summary = msgs.length ? `${msgs.length} messages from ${people.length} people, ${fmtShort(msgs[0].t)} to ${fmtShort(msgs[msgs.length-1].t)}. ${count("decision")} decisions made, ${count("request")+count("task")} asks and commitments open, ${count("risk")} risks flagged. Most of the talk is about ${threads[0]?.name.toLowerCase()}.` : "";
  return {source:"local", summary, threads, items, next:[]};
}

/* ---------- state ---------- */
const state = { name:SAMPLE_NAME, sample:true, msgs:[], an:null, view:"overview", thread:null, done:{}, q:"", kindF:"", personF:"", threadF:"", guide:!store.get("guideHidden") };
const chatKey = () => state.name + "|" + state.msgs.length;
function load(raw, name, isSample){
  const msgs = parseChat(raw); if (!msgs.length) return false;
  Object.assign(state,{msgs, name, sample:!!isSample, thread:null, q:"", kindF:"", personF:"", threadF:""});
  const saved = store.get("analysis");
  state.an = (saved && saved.key===chatKey()) ? saved.an : localAnalyze(msgs);
  state.done = store.get("done:"+chatKey()) || {};
  return true;
}
const byId = id => state.msgs[id-1];
const threadOf = id => state.an.threads.find(t=>t.ids.includes(id));
const tcolor = id => `var(--${threadOf(id)?.color||"violet"})`;
const PCOL = ["signal","lime","cyan","amber","violet","coral"];
function people(){
  const map = {};
  state.msgs.forEach(m=>{ const p = map[m.author] ||= {name:m.author,n:0,media:0,first:m.t,last:m.t}; p.n++; if(m.media)p.media++; p.last=m.t; });
  const arr = Object.values(map).sort((a,b)=>b.n-a.n);
  arr.forEach((p,i)=>{ p.color = PCOL[i%PCOL.length]; p.open = openItems().filter(it=>it.owner===p.name).length; });
  return arr;
}
const pcolor = name => `var(--${(people().find(p=>p.name===name)||{color:"signal"}).color})`;
function openItems(){ return state.an.items.filter(i=>i.kind!=="decision" && !state.done[i.id]); }
function resolvedPct(){ const all = state.an.items.filter(i=>i.kind!=="decision"); return all.length ? Math.round(all.filter(i=>state.done[i.id]).length/all.length*100) : 0; }
const chatEnd = () => state.msgs[state.msgs.length-1].t;

/* ---------- shared bits ---------- */
const kindTag = k => k ? `<span class="kind k-${k}">${k}</span>` : "";
function itemRow(i, opts={}){
  const m = byId(i.id); if (!m) return "";
  const done = !!state.done[i.id];
  return `<div class="item ${done?"done-row":""}">
    ${i.kind==="decision" ? `<span class="check" aria-hidden="true" style="border-color:transparent;color:var(--signal)">${ICON.check.replace('<svg','<svg style="opacity:1"')}</span>` : `<button class="check" data-done="${i.id}" aria-pressed="${done}" aria-label="Mark ${done?"open":"done"}">${ICON.check}</button>`}
    <div style="min-width:0"><div class="t">${esc(i.text)}</div><div class="s">${esc(i.owner||m.author)}${i.due?` · <span class="due">${esc(i.due)}</span>`:""} · ${fmtDay(m.t)} ${fmtTime(m.t)}</div></div>
    ${opts.noTag?"":kindTag(i.kind)}
  </div>`;
}
function msgRow(m){
  const it = state.an.items.find(i=>i.id===m.id);
  return `<div class="msg"><span class="av" style="--pc:${pcolor(m.author)}">${esc(initials(m.author))}</span><div style="min-width:0">
    <div class="who"><b>${esc(m.author)}</b><span class="mono">${fmtTime(m.t)}</span>${it?kindTag(it.kind):""}</div>
    <div class="what">${m.text?esc(m.text):""}${m.media?` <span class="photo">${ICON.cam} Photo</span>`:""}</div></div></div>`;
}

/* ---------- views ---------- */
function topbar(){
  const m = state.msgs;
  return `<header class="top"><div style="min-width:0">
    <div class="lbl">${state.sample?"Sample project":"Project"}</div>
    <h1>${esc(state.name)}</h1>
    <div class="meta"><span class="sync ${state.sample?"sample":""}"><i></i>${state.sample?"Sample chat, not your data":"Imported from WhatsApp"}</span><span>·</span><span>${fmtShort(m[0].t)} to ${fmtShort(chatEnd())}</span><span>·</span><span>${state.an.source==="claude"?"Sorted by Claude":"Sorted on this device"}</span></div>
  </div><div class="acts">
    <button class="btn" data-act="import">${ICON.file}Import chat</button>
    <button class="btn primary" data-act="claude" hidden>${ICON.spark}Deep analysis</button>
  </div></header>`;
}
function vOverview(){
  const an = state.an, ppl = people(), open = openItems();
  const risks = open.filter(i=>i.kind==="risk");
  const end = chatEnd();
  const attention = [...risks.slice().reverse(), ...open.filter(i=>i.kind!=="risk").sort((a,b)=>a.id-b.id)].slice(0,4);
  const quiet = ppl.filter(p=>p.open).sort((a,b)=>a.last-b.last)[0];
  const strong = an.threads[0]; const strongRisks = strong ? an.items.filter(i=>i.kind==="risk" && strong.ids.includes(i.id)).length : 0;
  const pct = resolvedPct();
  const guide = state.guide ? `<section class="panel guide">
    <div class="lbl">Get started</div>
    <div class="step done"><span class="n">1</span><div><b>Explore the sample</b>This is a demo project chat.</div></div>
    <div class="step ${state.sample?"":"done"}"><span class="n">2</span><div><b>Import your chat</b>Export it from WhatsApp, drop it in.</div></div>
    <div class="step"><span class="n">3</span><div><b>Act on it</b>Tick off asks, send the update.</div></div>
    <div style="display:flex;gap:8px"><button class="btn primary sm" data-act="import">Import chat</button><button class="btn ghost sm" data-act="hideGuide">Hide</button></div>
  </section>` : "";
  return `${topbar()}${guide}
  <section class="kpis">
    <div class="panel kpi"><b>${state.msgs.length}</b><span>Messages</span></div>
    <div class="panel kpi"><b>${open.filter(i=>i.kind!=="risk").length}</b><span>Open asks</span></div>

/* ---------- pulse + orbit ---------- */
function pulseData(){
  const m = state.msgs; const span = (chatEnd()-m[0].t)/864e5;
  const unit = span>70 ? "week" : span>14 ? "day" : span>4 ? "6 hours" : "2 hours";
  const hrs = {"6 hours":6,"2 hours":2}[unit];
  const key = d => { const x = new Date(d); if (hrs){ x.setMinutes(0,0,0); x.setHours(x.getHours()-x.getHours()%hrs); return +x; } x.setHours(0,0,0,0); if (unit==="week") x.setDate(x.getDate()-((x.getDay()+6)%7)); return +x; };
  const map = new Map(); m.forEach(x=>map.set(key(x.t),(map.get(key(x.t))||0)+1));
  const step = hrs ? hrs*36e5 : unit==="week" ? 7*864e5 : 864e5;
  let start = key(m[0].t), end = key(chatEnd());
  if (hrs){ const s = new Date(start); s.setHours(0); start = +s; const e = new Date(end); e.setHours(24-hrs); end = +e; }
  const pts = [];
  for (let t=start; t<=end+1; t+=step){ const k = key(t); pts.push([k, map.get(k)||0]); if (pts.length>400) break; }
  return {pts, unit, hrs};
}
function drawPulse(){
  const svg = $("#pulseSvg"); if (!svg) return;
  const {pts, hrs} = pulseData(), max = Math.max(...pts.map(p=>p[1]),1), n = pts.length;
  const X = i => n===1 ? 500 : 20 + i*(960/(n-1)), Y = v => 100 - v/max*82;
  const P = pts.map((p,i)=>[X(i),Y(p[1])]);
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i=0;i<P.length-1;i++){ const [x0,y0]=P[Math.max(0,i-1)],[x1,y1]=P[i],[x2,y2]=P[i+1],[x3,y3]=P[Math.min(P.length-1,i+2)];
    d += ` C${x1+(x2-x0)/6},${y1+(y2-y0)/6} ${x2-(x3-x1)/6},${y2-(y3-y1)/6} ${x2},${y2}`; }
  if (n===1) d = `M20,${P[0][1]} L980,${P[0][1]}`;
  svg.innerHTML = `<defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#25FF94" stop-opacity=".35"/><stop offset="1" stop-color="#25FF94" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${n===1?980:P[P.length-1][0]},110 L20,110Z" fill="url(#pg)"/><path d="${d}" fill="none" stroke="#C8FF50" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
    <line id="pulseCursor" x1="0" x2="0" y1="0" y2="110" stroke="#25FF94" stroke-dasharray="3 4" vector-effect="non-scaling-stroke" opacity="0"/>`;
  const every = Math.max(1, Math.ceil(n/8));
  const label = (p,i) => hrs ? (new Date(p[0]).getHours()===0 ? fmtDay(new Date(p[0])) : "") : (i%every===0 ? fmtShort(new Date(p[0])) : "");
  $("#pulseDays").innerHTML = pts.map((p,i)=>{ const l = label(p,i); return l ? `<span style="left:${X(i)/10}%;transform:none">${l}</span>` : ""; }).join("");
  const stamp = d => hrs ? `${fmtDay(d)} ${fmtTime(d)}` : fmtShort(d);
  const wrap = $("#pulse");
  wrap.onpointermove = e => {
    const r = svg.getBoundingClientRect(); const x = (e.clientX-r.left)/r.width*1000;
    const i = Math.max(0,Math.min(n-1,Math.round((x-20)/(960/Math.max(1,n-1)))));
    const c = $("#pulseCursor"); c.setAttribute("x1",X(i)); c.setAttribute("x2",X(i)); c.setAttribute("opacity",1);
    let tip = $("#ptip"); if (!tip){ tip = document.createElement("div"); tip.id="ptip"; tip.className="tip"; wrap.appendChild(tip); }
    tip.style.left = (X(i)/1000*r.width + (r.left-wrap.getBoundingClientRect().left))+"px"; tip.style.top = (Y(pts[i][1])/110*r.height + (r.top-wrap.getBoundingClientRect().top))+"px";
    tip.textContent = `${stamp(new Date(pts[i][0]))} · ${pts[i][1]} message${pts[i][1]===1?"":"s"}`;
  };
  wrap.onpointerleave = () => { $("#ptip")?.remove(); $("#pulseCursor")?.setAttribute("opacity",0); };
}
let orbitRAF = 0;
function drawOrbit(){
  cancelAnimationFrame(orbitRAF);
  const el = $("#orbit"); if (!el) return;
  const W = el.clientWidth, ppl = people().slice(0,12), extra = people().length - ppl.length, max = ppl[0]?.n || 1;
  const narrow = W < 560;
  const ringsN = ppl.length>7 ? 3 : ppl.length>3 ? 2 : 1;
  const base = narrow ? W*0.22 : Math.min(W*0.2, 270), stepR = narrow ? W*0.13 : Math.min(W*0.14, 200);
  const rx = i => base + i*stepR, tilt = narrow ? 0.42 : 0.3;
  const H = Math.round(rx(ringsN-1)*tilt*2 + (narrow?150:170));
  el.style.height = H+"px";
  const cx = W/2, cy = H/2 + 6;
  const coreSize = narrow ? 76 : 104;
  const caps = [3,4,5];
  const slots = ppl.map((p,i)=>{ let r=0,c=i; while (r<ringsN-1 && c>=caps[r]){ c-=caps[r]; r++; } return {p,r}; });
  const perRing = {}; slots.forEach(s=>perRing[s.r]=(perRing[s.r]||0)+1);
  const idx = {}; slots.forEach(s=>{ s.k = idx[s.r]=(idx[s.r]||0); idx[s.r]++; s.a0 = s.k/perRing[s.r]*Math.PI*2 + s.r*0.9 + 0.5; s.size = Math.round((narrow?30:36) + (narrow?26:38)*Math.sqrt(s.p.n/max)); });
  el.innerHTML = Array.from({length:ringsN},(_,i)=>`<div class="ring" data-ring="${i}" style="left:${cx}px;top:${cy}px;width:${rx(i)*2}px;height:${rx(i)*2*tilt}px"></div>`).join("")
    + `<div class="core" style="left:${cx}px;top:${cy}px;width:${coreSize}px;height:${coreSize}px;z-index:${Math.round(cy)};font-size:${narrow?11:13}px"><span>${esc(state.name.split("·")[0].trim().split(" ").slice(0,2).join(" "))}<small>${state.msgs.length} msgs</small></span></div>`
    + slots.map((s,i)=>`<button class="planet" data-person="${esc(s.p.name)}" data-i="${i}" style="--pc:var(--${s.p.color})" aria-label="${esc(s.p.name)}, ${s.p.n} messages${s.p.open?`, ${s.p.open} open items`:""}"><span class="ball" style="width:${s.size}px;height:${s.size}px;font-size:${Math.max(12,s.size/3)}px;position:relative">${esc(initials(s.p.name))}${s.p.open?`<span class="dot"></span>`:""}</span><span class="nm">${esc(firstName(s.p.name))} · ${s.p.n}</span></button>`).join("")
    + (extra>0?`<div style="position:absolute;right:18px;bottom:14px;font-size:12px;color:var(--muted)">+ ${extra} more in People</div>`:"");
  const nodes = [...el.querySelectorAll(".planet")];
  nodes.forEach(n=>{ const r = slots[+n.dataset.i].r;
    n.addEventListener("pointerenter",()=>{ el.querySelector(`.ring[data-ring="${r}"]`)?.classList.add("hot"); paused=true; });
    n.addEventListener("pointerleave",()=>{ el.querySelector(`.ring[data-ring="${r}"]`)?.classList.remove("hot"); paused=false; }); });
  const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
  let paused = false, t0 = performance.now(), off = 0, last = t0;
  const place = () => slots.forEach((s,i)=>{
    const a = s.a0 + off*(1 - s.r*0.25), R = rx(s.r);
    const x = cx + Math.cos(a)*R, y = cy + Math.sin(a)*R*tilt, depth = (Math.sin(a)+1)/2;
    const n = nodes[i]; n.style.transform = `translate(${x - s.size/2}px,${y - s.size/2}px) scale(${0.8+depth*0.25})`;
    n.style.zIndex = Math.round(y); n.style.opacity = 0.65 + depth*0.35; n.style.transformOrigin = `${s.size/2}px ${s.size/2}px`;
  });
  place();
  if (still) return;
  const tick = now => { if (!paused) off += (now-last)*0.00005; last = now; place(); orbitRAF = requestAnimationFrame(tick); };
  orbitRAF = requestAnimationFrame(tick);
}

      <button class="src" data-src="live" aria-pressed="${imp.src==="live"}">${ICON.live}<b>Live sync</b><span>Needs WhatsApp Business setup.</span></button>
    </div>` + (imp.src==="file" ? `
      <label class="drop" id="drop" for="file"><b>Drop your chat export here</b><span class="muted">or click to choose a .zip or .txt file</span></label>
      <input id="file" type="file" accept=".txt,.zip,text/plain,application/zip" hidden>
      <div class="howto"><div class="panel card" style="padding:14px"><span class="lbl">On iPhone</span><ol><li>Open the chat, tap its name at the top</li><li>Scroll down, tap <b>Export chat</b></li><li>Choose <b>Without media</b>, save to Files</li></ol></div>
      <div class="panel card" style="padding:14px"><span class="lbl">On Android</span><ol><li>Open the chat, tap <b>⋮</b> then <b>More</b></li><li>Tap <b>Export chat</b></li><li>Choose <b>Without media</b>, save or email it</li></ol></div></div>`
    : imp.src==="paste" ? `<textarea id="paste" placeholder="[27/10/2026, 9:12 AM] Daniel: Morning team…" aria-label="Chat text">${esc(imp.text)}</textarea>`
    : `<div class="panel card"><p class="big" style="margin:0 0 8px">Live sync keeps the dashboard updated as messages arrive.</p><p class="muted" style="margin:0;font-size:14px">It works through the WhatsApp Business Platform: a business phone number, a Meta developer app, and a small server that receives new messages and forwards them here. Personal WhatsApp accounts can't be connected live. Until it's set up, re-export the chat whenever you want fresh numbers.</p></div>`)
    + (imp.err?`<p class="err" role="alert">${esc(imp.err)}</p>`:"");
  } else if (imp.step===2){
    const m = imp.msgs, ppl = new Set(m.map(x=>x.author));
    body = `<p class="muted" style="margin:0 0 6px">Here's what we found. Check it looks right, then name the project.</p>
      <div class="preview"><div><b>${m.length}</b><span>messages</span></div><div><b>${ppl.size}</b><span>people</span></div><div><b>${m.filter(x=>x.media).length}</b><span>photos & files</span></div><div><b>${Math.max(1,Math.round((m[m.length-1].t-m[0].t)/864e5))}</b><span>days, ${fmtShort(m[0].t)} to ${fmtShort(m[m.length-1].t)}</span></div></div>
      <div class="panel card" style="padding:4px 16px">${m.slice(-3).map(msgRowLite).join("")}</div>
      <div class="field"><label for="pname" class="lbl">Project name</label><input id="pname" value="${esc(imp.name)}" maxlength="60"></div>
      ${imp.err?`<p class="err" role="alert">${esc(imp.err)}</p>`:""}`;
  }
  layer(`<div class="scrim" data-close></div><div class="modal" role="dialog" aria-modal="true" aria-label="Import a WhatsApp chat">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><span class="lbl">Import</span><h2 style="font-size:28px;margin-top:4px">${imp.step===1?"Bring in a WhatsApp chat":"Ready to open"}</h2></div><button class="xbtn" data-close aria-label="Close">${ICON.x}</button></div>
    <div class="stepper">${steps.map((s,i)=>`<span class="${i+1<=imp.step?"on":""}">${i+1} ${s}</span>`).join("")}</div>
    ${body}
    <div class="mfoot">${imp.step===2?`<button class="btn ghost" data-imp="back">Back</button>`:`<button class="btn ghost" data-act="sample">Use the sample instead</button>`}
      ${imp.step===1 && imp.src==="paste"?`<button class="btn primary" data-imp="paste">Check messages</button>`:""}
      ${imp.step===2?`<button class="btn primary" data-imp="open">Open dashboard</button>`:""}</div>
    <p class="privacy">${ICON.lock}Your chat is read in this browser and kept only on this device.${sampleFn?" It's sent to Claude only when you choose Deep analysis.":""}</p>
  </div>`);
  const drop = $("#drop"), file = $("#file");
  if (drop){
    file.onchange = () => file.files[0] && readFile(file.files[0]);
    ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
    ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
    drop.addEventListener("drop",ev=>ev.dataTransfer.files[0] && readFile(ev.dataTransfer.files[0]));
  }
  $("#paste")?.addEventListener("input",e=>{ imp.text = e.target.value; });
}
function msgRowLite(m){ return `<div class="msg"><span class="av" style="--pc:var(--signal)">${esc(initials(m.author))}</span><div style="min-width:0"><div class="who"><b>${esc(m.author)}</b><span class="mono">${fmtShort(m.t)} ${fmtTime(m.t)}</span></div><div class="what">${m.text?esc(m.text.slice(0,140)):""}${m.media?` <span class="photo">${ICON.cam} Photo</span>`:""}</div></div></div>`; }
async function readFile(f){
  try{
    let text, name = f.name.replace(/\.(txt|zip)$/i,"").replace(/^WhatsApp Chat (with|-)\s*/i,"").trim() || "WhatsApp chat";
    if (/\.zip$/i.test(f.name)){
      if (!window.JSZip){ imp.err = "Zip files can't be opened here. Unzip it and drop the .txt inside."; return drawImport(); }
      const zip = await JSZip.loadAsync(f);
      const entry = Object.values(zip.files).find(z=>/_chat\.txt$/i.test(z.name)) || Object.values(zip.files).find(z=>/\.txt$/i.test(z.name));
      if (!entry){ imp.err = "That zip has no chat .txt inside. Export the chat again and choose Without media."; return drawImport(); }
      text = await entry.async("string");
    } else text = await f.text();
    checkText(text, name);
  }catch(e){ imp.err = "That file couldn't be read. Try the .txt export instead."; drawImport(); }
}
function checkText(text, name){
  const msgs = parseChat(text);
  if (!msgs.length){ imp.err = "No WhatsApp messages found. Lines should start with a date and time, like [27/10/2026, 9:12 AM] Name: message."; return drawImport(); }
  Object.assign(imp,{step:2,text,name,msgs,err:""}); drawImport(); $("#pname")?.focus();
}
function finishImport(){
  const name = ($("#pname")?.value || "").trim();
  if (!name){ imp.err = "Give the project a name so you can tell chats apart."; drawImport(); return; }
  load(imp.text, name, false);
  store.set("chat",{text:imp.text,name}); store.del("analysis");
  closeLayer(); go("overview"); toast(`${state.msgs.length} messages sorted into ${state.an.threads.length} threads`);
}

/* ---------- Claude ---------- */
let sampleFn = null, aiCtl = null;
async function deepAnalysis(){
  if (!sampleFn) return;
  aiCtl = new AbortController();
  const msgs = state.msgs.slice(-700);
  let body = msgs.map(m=>`#${m.id} [${m.t.toISOString().slice(0,16).replace("T"," ")}] ${m.author}: ${m.text?m.text.slice(0,280).replace(/\n/g," "):"(photo)"}${m.media&&m.text?" (photo)":""}`).join("\n");
  if (body.length>150000) body = body.slice(-150000);
  const prompt = `You are a project manager reading a WhatsApp group chat for a design and build project. Organize it.

Reply with ONLY a JSON object of this shape:
{"summary":"2-3 plain sentences on where the project stands",
 "threads":[{"name":"2-3 word topic","subtopics":["1-2 words","1-2 words","1-2 words"],"ids":[message numbers]}],
 "items":[{"id":message number,"kind":"decision|request|task|risk","text":"short rewrite, max 18 words","owner":"person responsible or empty","due":"due date text or empty"}],
 "next":["Owner: next step (due)"]}

Rules: 3 to 6 threads; every message number belongs to exactly one thread. A request is something someone asked for that still needs doing; a task is something someone committed to; a risk is a problem, delay or defect. Only include items the chat supports. Up to 8 next steps, most urgent first. Use names exactly as written in the chat.

Chat (#number [date time] author: text):
${body}`;
  layer(`<div class="scrim"></div><div class="modal" role="dialog" aria-modal="true" aria-label="Deep analysis"><div style="display:flex;gap:18px;align-items:center"><span class="spin"></span><div><span class="lbl">Deep analysis</span><h2 style="font-size:24px;margin-top:4px">Claude is reading ${msgs.length} messages</h2><p class="muted" style="margin:4px 0 0">Finding threads, decisions and who owes what. This usually takes under a minute.</p></div></div><div class="mfoot"><span></span><button class="btn" data-act="stopAi">Stop</button></div></div>`);
  try{
    const r = await sampleFn.json(prompt, {signal:aiCtl.signal});
    const valid = new Set(state.msgs.map(m=>m.id)), seen = new Set();
    const threads = (r.threads||[]).slice(0,6).map((t,i)=>{
      const ids = (t.ids||[]).map(Number).filter(id=>valid.has(id)&&!seen.has(id)); ids.forEach(id=>seen.add(id));
      return {key:"c"+i, name:String(t.name||"Thread "+(i+1)), ids, subs:(t.subtopics||[]).map(String).slice(0,4)};
    }).filter(t=>t.ids.length);
    const rest = state.msgs.filter(m=>!seen.has(m.id)).map(m=>m.id);
    if (rest.length) threads.push({key:"cx",name:"Other",ids:rest,subs:["Updates"]});
    threads.sort((a,b)=>b.ids.length-a.ids.length).forEach((t,i)=>{ t.color = TCOL[i%TCOL.length]; if(!t.subs.length) t.subs=["Updates"]; });
    const items = (r.items||[]).filter(i=>valid.has(Number(i.id)) && ["decision","request","task","risk"].includes(i.kind))
      .map(i=>({id:Number(i.id),kind:i.kind,text:String(i.text||""),owner:String(i.owner||""),due:String(i.due||"")})).sort((a,b)=>a.id-b.id);
    if (!threads.length) throw {code:"invalid_json"};
    state.an = {source:"claude", summary:String(r.summary||state.an.summary), threads, items, next:(r.next||[]).map(String).slice(0,8)};
    state.thread = null; store.set("analysis",{key:chatKey(), an:state.an});
    aiCtl = null; closeLayer(); render(); toast("Claude's analysis is ready");
  }catch(e){
    aiCtl = null; if (e?.code==="cancelled") return; closeLayer();
    const copy = {not_granted:"Claude wasn't allowed for this page. On-device sorting stays on.",sampling_disabled:"Claude isn't available on this account.",rate_limited:"Too many requests right now. Try again in a few minutes.",prompt_too_large:"This chat is too long to send in one go.",invalid_json:"Claude's answer couldn't be read. Try again.",session_expired:"Sign in to Claude again, then retry."};
    toast(copy[e?.code] || "Claude couldn't finish. Try again.");
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)){ sampleFn = null; render(); }
  }
}

/* ---------- layer / toast / copy ---------- */
let lastFocus = null;
function layer(html){ if (!$("#layer").innerHTML) lastFocus = document.activeElement; $("#layer").innerHTML = html; ($("#layer").querySelector(".drop,.src[aria-pressed='true'],textarea,input,button:not([data-close])")||$("#layer").querySelector("button"))?.focus(); }
function closeLayer(){ if (aiCtl){ aiCtl.abort(); aiCtl=null; } $("#layer").innerHTML = ""; lastFocus?.focus?.(); }
let tT; function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tT); tT = setTimeout(()=>el.hidden=true,2800); }
function copyText(text, el){
  navigator.clipboard.writeText(text).then(()=>toast("Copied. Paste it into WhatsApp")).catch(()=>{ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text selected. Press Ctrl+C to copy"); });
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button,[data-close],label") || e.target;
  if (e.target.closest("[data-close]")) return closeLayer();
  const d = t.dataset || {};
  if (d.view) return go(d.view);
  if (d.go) return go(d.go);
  if (d.act==="import") return openImport();
  if (d.act==="claude") return deepAnalysis();
  if (d.act==="stopAi") return closeLayer();
  if (d.act==="hideGuide"){ state.guide=false; store.set("guideHidden",1); return render(); }
  if (d.act==="sample"){ store.del("chat"); store.del("analysis"); load(SAMPLE,SAMPLE_NAME,true); closeLayer(); go("overview"); return toast("Sample chat loaded"); }
  if (d.src){ imp.src = d.src; imp.err=""; return drawImport(); }
  if (d.imp==="paste") return imp.text.trim() ? checkText(imp.text,"Pasted chat") : (imp.err="Paste a few lines of the chat first.", drawImport());
  if (d.imp==="back"){ imp.step=1; imp.err=""; return drawImport(); }
  if (d.imp==="open") return finishImport();
  if (d.done){ const id=d.done; if (state.done[id]) delete state.done[id]; else state.done[id]=1; store.set("done:"+chatKey(),state.done);
    const inDrawer = t.closest(".drawer"); const who = inDrawer?.getAttribute("aria-label"); render(); if (who) openPerson(who); return; }
  if (d.person !== undefined && t.matches(".planet,.pcard,[data-person]")) return openPerson(d.person);
  if (d.thread){ state.thread = d.thread; return go("threads"); }
  if (d.chatthread){ state.threadF = d.chatthread; state.q=""; state.kindF=""; return go("chat"); }
  if (d.pf !== undefined){ state.personF = d.pf; return render(); }
  if (d.tf !== undefined){ state.threadF = d.tf; return render(); }
  if (d.kf !== undefined){ state.kindF = d.kf; return render(); }
  if (d.copy) return copyText(outText(d.copy), $("#out-"+d.copy));
});
document.addEventListener("input", e=>{
  if (e.target.id!=="search") return;
  state.q = e.target.value; const pos = e.target.selectionStart; render(); const s = $("#search"); s.focus(); s.setSelectionRange(pos,pos);
});
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && $("#layer").innerHTML) closeLayer(); if (e.key==="Enter" && e.target.id==="pname") finishImport(); });
let rT; addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(state.view==="overview"){ drawPulse(); drawOrbit(); } },120); });

/* ---------- boot ---------- */
const saved = store.get("chat");
if (!(saved && load(saved.text, saved.name, false))) load(SAMPLE, SAMPLE_NAME, true);
const h = (location.hash||"").slice(1); if (["overview","threads","board","people","chat","outputs"].includes(h)) state.view = h;
render();
document.fonts?.ready.then(()=>{ if(state.view==="overview") drawOrbit(); });
(async()=>{ try{ sampleFn = await window.claude?.use?.("sample"); }catch(e){ sampleFn = null; } if (sampleFn) document.querySelectorAll('[data-act="claude"]').forEach(b=>b.hidden=false); })();
</script>

</body></html>
