<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Turn a WhatsApp project chat into threads, decisions, open asks and risks."><meta property="og:title" content="Threadline"><meta property="og:description" content="Turn a WhatsApp project chat into threads, decisions, open asks and risks."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Threadline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Signal orbit, game HUD. Starfield + moving grid floor behind, notched HUD panels that fly in and tilt, a WebGL orbit of the crew at the centre. Single dark look by design. */
:root{
  --bg:#020D09; --panel:rgba(6,32,22,.6); --panel-solid:#071D15; --line:rgba(37,255,148,.2); --line-strong:rgba(37,255,148,.42);
  --fg:#DFFFEF; --muted:#7FAF97; --dim:#4E7A65;
  --signal:#25FF94; --lime:#C8FF50; --cyan:#5CE1E6; --amber:#FFC24B; --coral:#FF7A5C; --violet:#B794F6;
  --on-signal:#02140C;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif; --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --notch:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.lbl{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--signal)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}

/* world: stars, grid floor, scanlines */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.nebula{position:fixed;inset:-5%;z-index:-3;pointer-events:none;background:url(assets/nebula.jpg) 70% 40%/cover no-repeat;opacity:.8;animation:drift 50s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.1) translate(-2.5%,1.5%)}}
.emptyart{display:flex;gap:16px;align-items:center;padding:10px 0}
.emptyart img{width:104px;height:104px;flex:none;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(circle,#000 52%,transparent 70%);mask-image:radial-gradient(circle,#000 52%,transparent 70%);animation:float 4.5s ease-in-out infinite}
.emptyart b{display:block;font-family:var(--f-display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--signal)}
.emptyart span{font-size:13px;color:var(--muted)}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.floor{position:fixed;left:-50%;right:-50%;bottom:-10vh;height:55vh;z-index:-1;pointer-events:none;
  background:linear-gradient(transparent,rgba(2,13,9,.0) 30%),repeating-linear-gradient(90deg,rgba(37,255,148,.13) 0 1px,transparent 1px 80px),repeating-linear-gradient(0deg,rgba(37,255,148,.13) 0 1px,transparent 1px 80px);
  transform:perspective(420px) rotateX(68deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%);animation:floor 3s linear infinite}
@keyframes floor{to{background-position:0 0,0 80px,0 80px}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:70;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.5}

/* app shell */
.app{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(2,13,9,.85),rgba(4,24,16,.75));z-index:20}
.logo{width:52px;height:52px;border-radius:50%;margin-bottom:14px;background:url(assets/core.jpg) center/150% no-repeat,#010805;mix-blend-mode:screen;box-shadow:0 0 24px rgba(37,255,148,.45);position:relative;animation:breathe 3s ease-in-out infinite}
.logo::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--line-strong);animation:spin 6s linear infinite;border-top-color:var(--lime)}
@keyframes breathe{50%{box-shadow:0 0 40px rgba(37,255,148,.9)}}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{position:relative;border:0;background:none;width:72px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:color .2s,background .2s}
.nav svg{width:22px;height:22px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.nav:hover{color:var(--fg);background:rgba(37,255,148,.08)}
.nav:hover svg{transform:translateY(-2px) scale(1.12)}
.nav[aria-current="page"]{color:var(--on-signal);background:linear-gradient(180deg,var(--lime),var(--signal));box-shadow:0 0 20px rgba(37,255,148,.4)}
.rail .spacer{flex:1}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px),2.4vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.4vw);padding-block:22px 48px;perspective:1400px}

/* hud panel */
.panel{position:relative;background:linear-gradient(160deg,rgba(14,52,36,.62),rgba(4,22,15,.66));border:1px solid var(--line);backdrop-filter:blur(10px);clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%,0 var(--notch));box-shadow:inset 0 1px 0 rgba(200,255,80,.12)}
.panel::before{content:"";position:absolute;left:var(--notch);right:30%;top:0;height:2px;background:linear-gradient(90deg,var(--signal),transparent);opacity:.8}
.tilt{transform-style:preserve-3d;transition:transform .25s ease-out,border-color .2s;will-change:transform}
.tilt:hover{border-color:var(--line-strong)}
.tilt::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px circle at var(--gx,50%) var(--gy,50%),rgba(200,255,80,.1),transparent 45%);opacity:0;transition:opacity .3s}
.tilt:hover::after{opacity:1}

/* reveal + type */
.rv{animation:rvIn .8s cubic-bezier(.16,.9,.24,1) backwards;animation-delay:var(--d,0ms)}
@keyframes rvIn{from{opacity:0;transform:translateY(34px) rotateX(-24deg) scale(.94);filter:blur(8px)}60%{filter:blur(0)}}
.typing::after{content:"";display:inline-block;width:.55em;height:1em;margin-left:2px;vertical-align:-.12em;background:var(--lime);box-shadow:0 0 10px var(--lime);animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.glitch{position:relative;display:inline-block}
.glitch.go::before,.glitch.go::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;animation:gl1 .6s steps(2) 2 forwards}
.glitch.go::before{color:var(--cyan);transform:translate(-3px,0);clip-path:inset(0 0 55% 0)}
.glitch.go::after{color:var(--coral);transform:translate(3px,0);clip-path:inset(55% 0 0 0);animation-name:gl2}
@keyframes gl1{50%{transform:translate(4px,-1px)}100%{opacity:0}}
@keyframes gl2{50%{transform:translate(-4px,1px)}100%{opacity:0}}

/* top bar */
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(26px,3.6vw,42px);line-height:1.05;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 0 30px rgba(37,255,148,.35)}
.top .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:7px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px var(--signal);animation:ping 1.6s ease-out infinite}
.sync.sample i{background:var(--amber);box-shadow:0 0 10px var(--amber)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(37,255,148,.7)}100%{box-shadow:0 0 0 10px rgba(37,255,148,0)}}
.top .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;border:1px solid var(--line-strong);background:rgba(37,255,148,.07);padding:10px 18px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:background .2s,transform .15s,box-shadow .2s}
.btn::before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover::before{left:130%}
.btn:hover{background:rgba(37,255,148,.16);box-shadow:0 0 22px rgba(37,255,148,.25)}
.btn:active{transform:translateY(2px) scale(.98)}
.btn svg{width:17px;height:17px}
.btn.primary{background:linear-gradient(180deg,#E2FF8A,var(--lime));border-color:transparent;color:var(--on-signal);box-shadow:0 0 26px rgba(200,255,80,.35)}
.btn.primary:hover{box-shadow:0 0 40px rgba(200,255,80,.6)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.sm{padding:7px 12px;font-size:12px}
.ph{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}

/* onboarding */
.guide{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr)) auto;gap:18px;align-items:center;padding:16px 20px;margin-bottom:20px;border-color:rgba(255,194,75,.4);background:linear-gradient(90deg,rgba(255,194,75,.12),rgba(6,32,22,.6))}
.guide::before{background:linear-gradient(90deg,var(--amber),transparent)}
.guide .lbl{color:var(--amber)}
.step{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--muted)}
.step b{display:block;color:var(--fg);font-size:14px}
.step .n{flex:none;width:30px;height:30px;transform:rotate(45deg);border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--f-display);color:var(--signal)}
.step .n span{transform:rotate(-45deg)}
.step.done .n{background:var(--signal);color:var(--on-signal);border-color:transparent;box-shadow:0 0 14px var(--signal)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(37,255,148,.4)}
.kpi .k1{font-family:var(--f-display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--signal)}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--coral);text-shadow:0 0 20px rgba(255,122,92,.5)}
.kpi.alert .k1{color:var(--coral)}
.xp{height:10px;margin-top:8px;background:rgba(37,255,148,.1);position:relative;overflow:hidden;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.xp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--signal),var(--lime));box-shadow:0 0 12px var(--signal);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.xp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(2,13,9,.9) 9px 11px)}

/* pulse */
.pulse{padding:16px 18px 10px;margin-bottom:18px}
.pulse svg{display:block;width:100%;height:110px;overflow:visible}
.pulse .days{position:relative;height:18px;font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.pulse .days span{position:absolute;white-space:nowrap}
.draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 2.2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{animation:fade 1.6s .6s backwards}
@keyframes fade{from{opacity:0}}
.tip{position:absolute;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line-strong);padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-120%);z-index:5;font-family:var(--f-mono)}

/* orbit */
.orbitwrap{position:relative;overflow:hidden;margin-bottom:18px;padding:0}
.orbit{position:relative;width:100%;height:480px}
.orbit canvas{display:block;width:100%;height:100%}
.tag{position:absolute;left:0;top:0;border:0;background:rgba(2,13,9,.72);border:1px solid var(--line);padding:3px 9px;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#A9FFD2;white-space:nowrap;will-change:transform;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);transition:color .2s,border-color .2s,background .2s}
.tag:hover,.tag.hot{color:var(--on-signal);background:var(--lime);border-color:transparent}
.tag em{font-style:normal;color:var(--coral);margin-left:6px}
.tag:hover em,.tag.hot em{color:var(--on-signal)}
.orbit-hud{position:absolute;inset:14px 18px auto;display:flex;justify-content:space-between;pointer-events:none;font-size:12px;color:var(--dim);gap:12px}
.orbit-legend{position:absolute;left:18px;bottom:14px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;pointer-events:none}
.orbit-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.reticle{position:absolute;width:90px;height:90px;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;border:1px solid rgba(200,255,80,.25);border-radius:50%;animation:spin 14s linear infinite;border-left-color:transparent;border-right-color:transparent}
/* css fallback planets */
.cplanet{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:var(--on-signal);background:radial-gradient(circle at 35% 30%,#F4FFF9,var(--pc) 60%);box-shadow:0 0 26px var(--pc);border:0}

/* cards */
.grid3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:14px}
.card{padding:18px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{font-size:14px}
.item .s{font-size:12px;color:var(--muted);margin-top:2px}
.kind{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;white-space:nowrap;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.k-risk{color:var(--coral)} .k-request{color:var(--cyan)} .k-task{color:var(--amber)} .k-decision{color:var(--signal)}
.check{width:24px;height:24px;transform:rotate(45deg) scale(.85);border:1.5px solid var(--line-strong);background:none;display:grid;place-items:center;padding:0;flex:none;transition:background .2s,box-shadow .2s,transform .2s}
.check svg{width:14px;height:14px;opacity:0;transform:rotate(-45deg)}
.check:hover{background:rgba(37,255,148,.15);transform:rotate(45deg) scale(1)}
.check[aria-pressed="true"]{background:var(--signal);border-color:transparent;color:var(--on-signal);box-shadow:0 0 14px var(--signal)}
.check[aria-pressed="true"] svg{opacity:1}
.check.fixed{border-color:transparent;color:var(--signal)}
.check.fixed svg{opacity:1}
.done-row .t{text-decoration:line-through;color:var(--dim)}
.big{font-family:var(--f-display);font-size:18px;line-height:1.4}
.summary{font-size:16px;line-height:1.65}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

/* threads */
.split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.tlist{display:flex;flex-direction:column;gap:10px}
.tbtn{text-align:left;width:100%;padding:14px 16px;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center}
.tbtn[aria-pressed="true"]{border-color:var(--tc);background:linear-gradient(90deg,color-mix(in oklab,var(--tc) 22%,transparent),rgba(4,22,15,.7))}
.tbtn i{width:12px;height:12px;transform:rotate(45deg);background:var(--tc);box-shadow:0 0 12px var(--tc)}
.tbtn b{font-family:var(--f-display);font-size:16px;font-weight:600}
.tbtn small{display:block;color:var(--muted);font-size:12px}
.tbtn .c{font-family:var(--f-display);font-size:24px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);padding:4px 12px;font-size:13px;background:none;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);transition:background .2s,color .2s}
button.chip:hover{background:rgba(37,255,148,.14)}
button.chip[aria-pressed="true"]{background:var(--signal);color:var(--on-signal);border-color:transparent}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--on-signal);background:radial-gradient(circle at 35% 30%,#F4FFF9,var(--pc,var(--signal)) 60%);box-shadow:0 0 14px color-mix(in oklab,var(--pc,var(--signal)) 60%,transparent)}
.msg .who{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .who b{font-weight:700}
.msg .who .mono{color:var(--dim);font-size:11px}
.msg .what{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.photo{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);border:1px dashed var(--line-strong);padding:2px 8px}
.daysep{font-family:var(--f-display);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);padding:16px 0 4px}

/* board */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.lane{padding:14px;min-width:0}
.lane h3{font-size:15px;letter-spacing:.16em;text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:10px}
.lane h3 span{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:0}
.bcard{position:relative;border:1px solid var(--line);border-left:3px solid var(--tc);background:rgba(2,13,9,.6);padding:11px 12px;margin-bottom:10px;transition:transform .2s,box-shadow .2s}
.bcard:hover{transform:translateX(4px);box-shadow:-6px 0 18px -6px var(--tc)}
.bcard .t{font-size:14px}
.bcard .f{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
.due{color:var(--amber);font-weight:600}
.bcard.done{opacity:.5}
.bcard.done .t{text-decoration:line-through}

/* people */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{padding:18px;text-align:left;width:100%}
.prow{display:flex;gap:12px;align-items:center}
.prow .av{width:50px;height:50px;font-size:17px}
.lv{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--on-signal);background:var(--pc);padding:2px 7px;margin-left:8px;vertical-align:2px}
.search{flex:1;min-width:200px;max-width:420px;border:1px solid var(--line-strong);padding:10px 14px;background:rgba(2,13,9,.65);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.search::placeholder{color:var(--dim)}

/* outputs */
.ogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ocard{padding:18px;display:flex;flex-direction:column;gap:12px}
.ocard pre{margin:0;white-space:pre-wrap;font:13.5px/1.6 var(--f-body);background:rgba(2,13,9,.65);border:1px solid var(--line);padding:14px;max-height:360px;overflow:auto;flex:1}
.ocard p{margin:0;font-size:13px;color:var(--muted)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(1,8,5,.72);backdrop-filter:blur(6px);z-index:40;animation:fade .3s backwards}

.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}

  const lines = raw.replace(/\r/g,"").replace(/[\u200e\u200f\u202a-\u202e\ufeff]/g,"").replace(/[\u202f\u00a0]/g," ").split("\n");
  const RE_IOS = /^\[(\d{1,4})[\/.\-](\d{1,2})[\/.\-](\d{1,4}),?\s+(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?\s*([ap]\.?\s?m\.?)?\]\s*([^:]{1,60}?):\s?([\s\S]*)$/i;
  const RE_AND = /^(\d{1,4})[\/.\-](\d{1,2})[\/.\-](\d{1,4}),?\s+(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?\s*([ap]\.?\s?m\.?)?\s[-–]\s([^:]{1,60}?):\s?([\s\S]*)$/i;
  const RE_HEAD = /^\[?\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{1,4},?\s+\d{1,2}[:.]\d{2}/;
  const raws = []; let cur = null;
  for (const line of lines){
    const m = line.match(RE_IOS) || line.match(RE_AND);
    if (m){ cur = {p:m.slice(1,8), author:m[8].trim(), text:m[9]}; raws.push(cur); }
    else if (RE_HEAD.test(line)){ cur = null; }
    else if (cur){ cur.text += "\n" + line; }
  }
  let order = "DMY";
  if (raws.some(r=>+r.p[0]>31)) order = "YMD";
  else if (raws.some(r=>+r.p[0]>12)) order = "DMY";
  else if (raws.some(r=>+r.p[1]>12)) order = "MDY";
  const msgs = [];
  raws.forEach(r=>{
    let [a,b,c,h,mi,s,ap] = r.p; let y,mo,d;
    if (order==="YMD"){y=+a;mo=+b;d=+c} else if (order==="MDY"){mo=+a;d=+b;y=+c} else {d=+a;mo=+b;y=+c}
    if (y<100) y+=2000;
    h=+h; if (ap){const pm=/p/i.test(ap); if(pm&&h<12)h+=12; if(!pm&&h===12)h=0;}
    const t = new Date(y,mo-1,d,h,+mi,+(s||0));
    const text = r.text.trim();
    if (/end-to-end encrypted|created (this )?group|changed the (subject|group)|joined using this group|security code changed/i.test(text)) return;
    const media = (text.match(MEDIA_RE)||[]).length > 0;
    const clean = text.replace(MEDIA_RE,"").trim();
    if (!clean && !media) return;
    msgs.push({id:msgs.length+1, t, author:r.author, text:clean, media});
  });
  return msgs;
}

/* ---------- on-device analysis ---------- */
function detectKind(m){ if (!m.text) return null; for (const k of ["decision","risk","request","task"]) if (KIND_RE[k].test(m.text)) return k; return null; }
function localAnalyze(msgs){
  const people = [...new Set(msgs.map(m=>m.author))];
  const firsts = people.map(p=>[firstName(p).toLowerCase(),p]);
  const tally = {}; DEFS.forEach(d=>tally[d.key]={});
  const assign = {};
  msgs.forEach((m,i)=>{
    let best=null,score=0;
    if (m.text) DEFS.forEach(d=>{
      const hits = m.text.match(d.re)||[];
      hits.forEach(h=>{const k=h.toLowerCase(); tally[d.key][k]=(tally[d.key][k]||0)+1});
      const s = hits.length*d.w; if (s>score){score=s;best=d.key}
    });
    if (!best){
      const prevSame = msgs.slice(0,i).reverse().find(p=>p.author===m.author);
      const prev = (prevSame && m.t-prevSame.t < 20*60e3) ? prevSame : (i>0 && m.t-msgs[i-1].t < 20*60e3 ? msgs[i-1] : null);
      best = prev ? assign[prev.id] : "general";
    }
    assign[m.id] = best;
  });
  const threads = [...DEFS,{key:"general",name:"General"}].map(d=>{
    const ids = msgs.filter(m=>assign[m.id]===d.key).map(m=>m.id);
    const subs = Object.entries(tally[d.key]||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([w])=>w[0].toUpperCase()+w.slice(1));
    return {key:d.key,name:d.name,ids,subs};
  }).filter(t=>t.ids.length).sort((a,b)=>b.ids.length-a.ids.length);
  threads.forEach((t,i)=>{ t.color = TCOL[i%TCOL.length]; if(!t.subs.length) t.subs=["Updates"]; });
  const items = [];
  msgs.forEach(m=>{
    const kind = detectKind(m); if (!kind) return;
    let owner = "";
    if (kind==="task"||kind==="decision") owner = m.author;
    if (kind==="request"){ const hit = firsts.find(([f,p])=>p!==m.author && f.length>1 && new RegExp("\\b"+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(m.text)); owner = hit ? hit[1] : ""; }
    const due = (m.text.match(DUE_RE)||[])[0] || "";
    items.push({id:m.id, kind, text:m.text.length>150?m.text.slice(0,147)+"…":m.text, owner, due:due.replace(/^(by|on|until) /i,"")});
  });
  const count = k => items.filter(i=>i.kind===k).length;
  const summary = msgs.length ? `${msgs.length} messages from ${people.length} people, ${fmtShort(msgs[0].t)} to ${fmtShort(msgs[msgs.length-1].t)}. ${count("decision")} decisions locked in, ${count("request")+count("task")} quests open, ${count("risk")} threats flagged. Most of the talk is about ${threads[0]?.name.toLowerCase()}.` : "";
  return {source:"local", summary, threads, items, next:[]};
}

/* ---------- state ---------- */
const state = { name:SAMPLE_NAME, sample:true, msgs:[], an:null, view:"overview", thread:null, done:{}, q:"", kindF:"", personF:"", threadF:"", guide:!store.get("guideHidden") };
const chatKey = () => state.name + "|" + state.msgs.length;
function load(raw, name, isSample){
  const msgs = parseChat(raw); if (!msgs.length) return false;
  Object.assign(state,{msgs, name, sample:!!isSample, thread:null, q:"", kindF:"", personF:"", threadF:""});
  const saved = store.get("analysis");
  state.an = (saved && saved.key===chatKey()) ? saved.an : localAnalyze(msgs);
  state.done = store.get("done:"+chatKey()) || {};
  return true;
}
const byId = id => state.msgs[id-1];
const threadOf = id => state.an.threads.find(t=>t.ids.includes(id));
const tcolor = id => `var(--${threadOf(id)?.color||"violet"})`;
function openItems(){ return state.an.items.filter(i=>i.kind!=="decision" && !state.done[i.id]); }
function people(){
  const map = {};
  state.msgs.forEach(m=>{ const p = map[m.author] ||= {name:m.author,n:0,media:0,first:m.t,last:m.t}; p.n++; if(m.media)p.media++; p.last=m.t; });
  const open = openItems();
  const arr = Object.values(map).sort((a,b)=>b.n-a.n);
  arr.forEach((p,i)=>{ p.color = PCOL[i%PCOL.length]; p.open = open.filter(it=>it.owner===p.name).length; });
  return arr;
}
const pcolor = name => `var(--${(people().find(p=>p.name===name)||{color:"signal"}).color})`;
function resolvedPct(){ const all = state.an.items.filter(i=>i.kind!=="decision"); return all.length ? Math.round(all.filter(i=>state.done[i.id]).length/all.length*100) : 0; }
const chatEnd = () => state.msgs[state.msgs.length-1].t;

/* ---------- shared bits ---------- */
const emptyArt = (title, text) => `<div class="emptyart"><img src="assets/allclear.jpg" alt=""><div><b>${esc(title)}</b><span>${esc(text)}</span></div></div>`;
const kindTag = k => k ? `<span class="kind k-${k}">${{risk:"threat",request:"quest",task:"commit",decision:"locked"}[k]||k}</span>` : "";
function itemRow(i){
  const m = byId(i.id); if (!m) return "";
  const done = !!state.done[i.id];
  return `<div class="item ${done?"done-row":""}">
    ${i.kind==="decision" ? `<span class="check fixed" aria-hidden="true">${ICON.check}</span>` : `<button class="check" data-done="${i.id}" aria-pressed="${done}" aria-label="Mark ${done?"open":"done"}">${ICON.check}</button>`}

    ${kindTag(i.kind)}
  </div>`;
}
function msgRow(m){
  const it = state.an.items.find(i=>i.id===m.id);
  return `<div class="msg"><span class="av" style="--pc:${pcolor(m.author)}">${esc(initials(m.author))}</span><div style="min-width:0">

}

function vBoard(){

  return `${topbar("Quest log")}<div class="filters"><span class="lbl">Filter</span>
    <button class="chip" data-pf="" aria-pressed="${!state.personF}">Everyone</button>${ppl.map(p=>`<button class="chip" data-pf="${esc(p.name)}" aria-pressed="${state.personF===p.name}">${esc(firstName(p.name))}</button>`).join("")}

/* ---------- pulse ---------- */
function pulseData(){
  const m = state.msgs; const span = (chatEnd()-m[0].t)/864e5;
  const unit = span>70 ? "week" : span>14 ? "day" : span>4 ? "6 hours" : "2 hours";
  const hrs = {"6 hours":6,"2 hours":2}[unit];
  const key = d => { const x = new Date(d); if (hrs){ x.setMinutes(0,0,0); x.setHours(x.getHours()-x.getHours()%hrs); return +x; } x.setHours(0,0,0,0); if (unit==="week") x.setDate(x.getDate()-((x.getDay()+6)%7)); return +x; };
  const map = new Map(); m.forEach(x=>map.set(key(x.t),(map.get(key(x.t))||0)+1));
  const step = hrs ? hrs*36e5 : unit==="week" ? 7*864e5 : 864e5;
  let start = key(m[0].t), end = key(chatEnd());
  if (hrs){ const s = new Date(start); s.setHours(0); start = +s; const e = new Date(end); e.setHours(24-hrs); end = +e; }
  const pts = [];
  for (let t=start; t<=end+1; t+=step){ const k = key(t); pts.push([k, map.get(k)||0]); if (pts.length>400) break; }
  return {pts, unit, hrs};
}
function drawPulse(animate){
  const svg = $("#pulseSvg"); if (!svg) return;
  const {pts, hrs} = pulseData(), max = Math.max(...pts.map(p=>p[1]),1), n = pts.length;
  const X = i => n===1 ? 500 : 20 + i*(960/(n-1)), Y = v => 100 - v/max*82;
  const P = pts.map((p,i)=>[X(i),Y(p[1])]);
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i=0;i<P.length-1;i++){ const [x0,y0]=P[Math.max(0,i-1)],[x1,y1]=P[i],[x2,y2]=P[i+1],[x3,y3]=P[Math.min(P.length-1,i+2)];
    d += ` C${x1+(x2-x0)/6},${y1+(y2-y0)/6} ${x2-(x3-x1)/6},${y2-(y3-y1)/6} ${x2},${y2}`; }
  if (n===1) d = `M20,${P[0][1]} L980,${P[0][1]}`;
  const peak = P.reduce((a,b,i)=>pts[i][1]>pts[a][1]?i:a,0);
  svg.innerHTML = `<defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#25FF94" stop-opacity=".4"/><stop offset="1" stop-color="#25FF94" stop-opacity="0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs>
    <path class="${animate?"fadein":""}" d="${d} L${n===1?980:P[P.length-1][0]},110 L20,110Z" fill="url(#pg)"/>
    <path class="${animate?"draw":""}" d="${d}" fill="none" stroke="#C8FF50" stroke-width="5" opacity=".35" filter="url(#glow)"/>
    <path class="${animate?"draw":""}" d="${d}" fill="none" stroke="#C8FF50" stroke-width="2.2"/>
    <circle class="${animate?"fadein":""}" cx="${P[peak][0]}" cy="${P[peak][1]}" r="4" fill="#C8FF50"><animate attributeName="r" values="4;9;4" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <line id="pulseCursor" x1="0" x2="0" y1="0" y2="110" stroke="#25FF94" stroke-dasharray="3 4" vector-effect="non-scaling-stroke" opacity="0"/>`;
  const every = Math.max(1, Math.ceil(n/8));
  const label = (p,i) => hrs ? (new Date(p[0]).getHours()===0 ? fmtDay(new Date(p[0])) : "") : (i%every===0 ? fmtShort(new Date(p[0])) : "");
  $("#pulseDays").innerHTML = pts.map((p,i)=>{ const l = label(p,i); return l ? `<span style="left:${X(i)/10}%">${l}</span>` : ""; }).join("");
  const stamp = dd => hrs ? `${fmtDay(dd)} ${fmtTime(dd)}` : fmtShort(dd);
  const wrap = $("#pulse");
  wrap.onpointermove = e => {
    const r = svg.getBoundingClientRect(), wr = wrap.getBoundingClientRect(); const x = (e.clientX-r.left)/r.width*1000;
    const i = Math.max(0,Math.min(n-1,Math.round((x-20)/(960/Math.max(1,n-1)))));
    const c = $("#pulseCursor"); c.setAttribute("x1",X(i)); c.setAttribute("x2",X(i)); c.setAttribute("opacity",1);
    let tip = $("#ptip"); if (!tip){ tip = document.createElement("div"); tip.id="ptip"; tip.className="tip"; wrap.appendChild(tip); }
    tip.style.left = (X(i)/1000*r.width + r.left-wr.left)+"px"; tip.style.top = (Y(pts[i][1])/110*r.height + r.top-wr.top)+"px";
    tip.textContent = `${stamp(new Date(pts[i][0]))} · ${pts[i][1]} msg`;
  };
  wrap.onpointerleave = () => { $("#ptip")?.remove(); $("#pulseCursor")?.setAttribute("opacity",0); };
}

    stars.forEach(s=>{ if (!STILL){ s.y += s.z*.15; if (s.y>H) s.y = 0; }
      const x = s.x - mx*40*s.z, y = s.y - my*30*s.z, a = .25 + .55*s.z*(.6+.4*Math.sin(now*.002+s.tw));
      g.fillStyle = `rgba(190,255,220,${a})`; g.fillRect(x, y, s.z*2.2, s.z*2.2); });
    if (!STILL) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
})();

/* ---------- fx: bursts + achievements ---------- */
function burst(x, y){
  if (STILL) return;
  const fx = $("#fx"), cols = ["#25FF94","#C8FF50","#5CE1E6","#FFC24B"];
  for (let i=0;i<22;i++){ const s = document.createElement("i"); s.className="spark"; const a = Math.random()*Math.PI*2, d = 40+Math.random()*80;
    s.style.cssText = `left:${x}px;top:${y}px;background:${cols[i%4]};box-shadow:0 0 8px ${cols[i%4]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--r:${Math.random()*360}deg`; fx.appendChild(s); setTimeout(()=>s.remove(), 900); }
  const xp = document.createElement("div"); xp.className="xpfloat"; xp.textContent="+25 XP"; xp.style.left = (x-28)+"px"; xp.style.top = (y-20)+"px"; fx.appendChild(xp); setTimeout(()=>xp.remove(),1200);
}
let achT;
function achieve(title, text){
  document.querySelector(".ach")?.remove(); clearTimeout(achT);
  const a = document.createElement("div"); a.className = "ach"; a.setAttribute("role","status");
  a.innerHTML = `<img class="medal" src="assets/badge.jpg" alt=""><div><b>${esc(title)}</b><span>${esc(text)}</span></div>`;
  document.body.appendChild(a);
  achT = setTimeout(()=>{ a.classList.add("out"); setTimeout(()=>a.remove(),400); }, 2600);
}
const toast = t => achieve("Update", t);

/* ---------- render ---------- */
function render(animate=false){
  if (SNAP) animate = false;
  document.querySelectorAll(".nav[data-view]").forEach(b=>b.setAttribute("aria-current", b.dataset.view===state.view ? "page" : "false"));
  const v = {overview:vOverview,threads:vThreads,board:vBoard,people:vPeople,chat:vChat,outputs:vOutputs}[state.view] || vOverview;
  gen++;
  $("#main").innerHTML = v();
  document.querySelectorAll('[data-act="claude"]').forEach(b=>b.hidden=!sampleFn);
  if (state.view==="overview"){ drawPulse(animate); drawOrbit(animate); } else destroyOrbit();
  if (animate) animateView();
}
function go(view){ state.view = view; try{ history.replaceState(null,"","#"+view); }catch(e){} render(true); window.scrollTo({top:0}); }

/* ---------- drawer ---------- */
function openPerson(name){
  const p = people().find(x=>x.name===name); if (!p) return;
  const its = state.an.items.filter(i=>i.owner===name || (!i.owner && byId(i.id)?.author===name));
  const mine = state.msgs.filter(m=>m.author===name).slice(-5);
  layer(`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(name)}" style="--pc:var(--${p.color})">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div class="prow"><span class="av" style="width:60px;height:60px;font-size:21px">${esc(initials(name))}</span><div><span class="lbl">Crew member</span><h2 style="font-size:24px">${esc(baseName(name))}<span class="lv">LV ${level(p.n)}</span></h2><div class="muted" style="font-size:13px">${p.n} messages · ${p.media} photos</div></div></div><button class="xbtn" data-close aria-label="Close">${ICON.x}</button></div>
    <div class="xp" style="margin-top:16px"><i style="width:${Math.min(100,(p.n%5)/5*100+20)}%"></i></div>
    <div class="lbl" style="margin:24px 0 4px">Quests</div>
    ${its.map(itemRow).join("") || emptyArt("Free agent", `No quests, commitments or decisions linked to ${firstName(name)}.`)}
    <div class="lbl" style="margin:24px 0 4px">Recent transmissions</div>
    ${mine.map(msgRow).join("")}
  </aside>`);
}

/* ---------- import flow ---------- */
const imp = { step:1, src:"file", text:"", name:"", msgs:null, err:"" };
function openImport(){ Object.assign(imp,{step:1,src:"file",text:"",name:"",msgs:null,err:""}); drawImport(); }
function drawImport(){
  const steps = ["Choose source","Scan","Launch"];
  let body = "";
  if (imp.step===1){
    body = `<div class="sources">
      <button class="src" data-src="file" aria-pressed="${imp.src==="file"}">${ICON.file}<b>Chat export</b><span>Best option. A .zip or .txt from WhatsApp.</span></button>
      <button class="src" data-src="paste" aria-pressed="${imp.src==="paste"}">${ICON.paste}<b>Paste messages</b><span>For a short stretch of chat.</span></button>
      <button class="src" data-src="live" aria-pressed="${imp.src==="live"}">${ICON.live}<b>Live sync</b><span>Needs WhatsApp Business setup.</span></button>
    </div>` + (imp.src==="file" ? `
      <label class="drop" id="drop" for="file"><b>Drop your chat export here</b><span class="muted">or click to choose a .zip or .txt file</span></label>
      <input id="file" type="file" accept=".txt,.zip,text/plain,application/zip" hidden>
      <div class="howto"><div class="panel card" style="padding:14px"><span class="lbl">On iPhone</span><ol><li>Open the chat, tap its name at the top</li><li>Scroll down, tap <b>Export chat</b></li><li>Choose <b>Without media</b>, save to Files</li></ol></div>
      <div class="panel card" style="padding:14px"><span class="lbl">On Android</span><ol><li>Open the chat, tap <b>⋮</b> then <b>More</b></li><li>Tap <b>Export chat</b></li><li>Choose <b>Without media</b>, save or email it</li></ol></div></div>`
    : imp.src==="paste" ? `<textarea id="paste" placeholder="[27/10/2026, 9:12 AM] Daniel: Morning team…" aria-label="Chat text">${esc(imp.text)}</textarea>`
    : `<div class="panel card"><p class="big" style="margin:0 0 8px">Live sync keeps the dashboard updated as messages arrive.</p><p class="muted" style="margin:0;font-size:14px">It works through the WhatsApp Business Platform: a business phone number, a Meta developer app, and a small server that receives new messages and forwards them here. Personal WhatsApp accounts can't be connected live. Until it's set up, re-export the chat whenever you want fresh numbers.</p></div>`)
    + (imp.err?`<p class="err" role="alert">${esc(imp.err)}</p>`:"");
  } else if (imp.step===2){
    const m = imp.msgs, ppl = new Set(m.map(x=>x.author));
    body = `<p class="muted" style="margin:0 0 6px">Scan complete. Check it looks right, then name the mission.</p>
      <div class="preview"><div><b>${m.length}</b><span>messages</span></div><div><b>${ppl.size}</b><span>crew</span></div><div><b>${m.filter(x=>x.media).length}</b><span>photos & files</span></div><div><b>${Math.max(1,Math.round((m[m.length-1].t-m[0].t)/864e5))}</b><span>days, ${fmtShort(m[0].t)} to ${fmtShort(m[m.length-1].t)}</span></div></div>
      <div class="panel card" style="padding:4px 16px">${m.slice(-3).map(x=>`<div class="msg"><span class="av">${esc(initials(x.author))}</span><div style="min-width:0"><div class="who"><b>${esc(x.author)}</b><span class="mono">${fmtShort(x.t)} ${fmtTime(x.t)}</span></div><div class="what">${x.text?esc(x.text.slice(0,140)):""}${x.media?` <span class="photo">${ICON.cam} Photo</span>`:""}</div></div></div>`).join("")}</div>
      <div class="field"><label for="pname" class="lbl">Mission name</label><input id="pname" value="${esc(imp.name)}" maxlength="60"></div>
      ${imp.err?`<p class="err" role="alert">${esc(imp.err)}</p>`:""}`;
  }
  layer(`<div class="scrim" data-close></div><div class="modal" role="dialog" aria-modal="true" aria-label="Import a WhatsApp chat">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><span class="lbl">Import</span><h2 style="font-size:28px;margin-top:4px;text-transform:uppercase;letter-spacing:.04em">${imp.step===1?"Bring in a WhatsApp chat":"Ready to launch"}</h2></div><button class="xbtn" data-close aria-label="Close">${ICON.x}</button></div>
    <div class="stepper">${steps.map((s,i)=>`<span class="${i+1<=imp.step?"on":""}">${i+1} ${s}</span>`).join("")}</div>
    ${body}
    <div class="mfoot">${imp.step===2?`<button class="btn ghost" data-imp="back">Back</button>`:`<button class="btn ghost" data-act="sample">Use the sample instead</button>`}
      ${imp.step===1 && imp.src==="paste"?`<button class="btn primary" data-imp="paste">Scan messages</button>`:""}
      ${imp.step===2?`<button class="btn primary" data-imp="open">Launch dashboard</button>`:""}</div>
    <p class="privacy">${ICON.lock}Your chat is read in this browser and kept only on this device.${sampleFn?" It's sent to Claude only when you choose Deep scan.":""}</p>
  </div>`);
  const drop = $("#drop"), file = $("#file");
  if (drop){
    file.onchange = () => file.files[0] && readFile(file.files[0]);
    ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
    ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
    drop.addEventListener("drop",ev=>ev.dataTransfer.files[0] && readFile(ev.dataTransfer.files[0]));
  }
  $("#paste")?.addEventListener("input",e=>{ imp.text = e.target.value; });
}
async function readFile(f){
  try{
    let text, name = f.name.replace(/\.(txt|zip)$/i,"").replace(/^WhatsApp Chat (with|-)\s*/i,"").trim() || "WhatsApp chat";
    if (/\.zip$/i.test(f.name)){
      if (!window.JSZip){ imp.err = "Zip files can't be opened here. Unzip it and drop the .txt inside."; return drawImport(); }
      const zip = await JSZip.loadAsync(f);
      const entry = Object.values(zip.files).find(z=>/_chat\.txt$/i.test(z.name)) || Object.values(zip.files).find(z=>/\.txt$/i.test(z.name));
      if (!entry){ imp.err = "That zip has no chat .txt inside. Export the chat again and choose Without media."; return drawImport(); }
      text = await entry.async("string");
    } else text = await f.text();
    checkText(text, name);
  }catch(e){ imp.err = "That file couldn't be read. Try the .txt export instead."; drawImport(); }
}
function checkText(text, name){
  const msgs = parseChat(text);
  if (!msgs.length){ imp.err = "No WhatsApp messages found. Lines should start with a date and time, like [27/10/2026, 9:12 AM] Name: message."; return drawImport(); }
  Object.assign(imp,{step:2,text,name,msgs,err:""}); drawImport(); $("#pname")?.focus();
}
function finishImport(){
  const name = ($("#pname")?.value || "").trim();
  if (!name){ imp.err = "Give the mission a name so you can tell chats apart."; drawImport(); return; }
  load(imp.text, name, false);
  store.set("chat",{text:imp.text,name}); store.del("analysis");
  closeLayer(); boot(() => { go("overview"); achieve("Mission loaded", `${state.msgs.length} messages sorted into ${state.an.threads.length} threads`); }, true);
}

/* ---------- Claude ---------- */
let sampleFn = null, aiCtl = null;
async function deepAnalysis(){
  if (!sampleFn) return;
  aiCtl = new AbortController();
  const msgs = state.msgs.slice(-700);
  let body = msgs.map(m=>`#${m.id} [${m.t.toISOString().slice(0,16).replace("T"," ")}] ${m.author}: ${m.text?m.text.slice(0,280).replace(/\n/g," "):"(photo)"}${m.media&&m.text?" (photo)":""}`).join("\n");
  if (body.length>150000) body = body.slice(-150000);
  const prompt = `You are a project manager reading a WhatsApp group chat for a design and build project. Organize it.

Reply with ONLY a JSON object of this shape:
{"summary":"2-3 plain sentences on where the project stands",
 "threads":[{"name":"2-3 word topic","subtopics":["1-2 words","1-2 words","1-2 words"],"ids":[message numbers]}],
 "items":[{"id":message number,"kind":"decision|request|task|risk","text":"short rewrite, max 18 words","owner":"person responsible or empty","due":"due date text or empty"}],
 "next":["Owner: next step (due)"]}

Rules: 3 to 6 threads; every message number belongs to exactly one thread. A request is something someone asked for that still needs doing; a task is something someone committed to; a risk is a problem, delay or defect. Only include items the chat supports. Up to 8 next steps, most urgent first. Use names exactly as written in the chat.

Chat (#number [date time] author: text):
${body}`;
  layer(`<div class="scrim"></div><div class="modal" role="dialog" aria-modal="true" aria-label="Deep scan"><div style="display:flex;gap:18px;align-items:center"><span class="spin"></span><div><span class="lbl">Deep scan</span><h2 style="font-size:24px;margin-top:4px">Claude is reading ${msgs.length} messages</h2><p class="muted" style="margin:4px 0 0">Mapping threads, decisions and who owes what. Usually under a minute.</p></div></div><div class="mfoot"><span></span><button class="btn" data-act="stopAi">Abort</button></div></div>`);
  try{
    const r = await sampleFn.json(prompt, {signal:aiCtl.signal});
    const valid = new Set(state.msgs.map(m=>m.id)), seen = new Set();
    const threads = (r.threads||[]).slice(0,6).map((t,i)=>{
      const ids = (t.ids||[]).map(Number).filter(id=>valid.has(id)&&!seen.has(id)); ids.forEach(id=>seen.add(id));
      return {key:"c"+i, name:String(t.name||"Thread "+(i+1)), ids, subs:(t.subtopics||[]).map(String).slice(0,4)};
    }).filter(t=>t.ids.length);
    const rest = state.msgs.filter(m=>!seen.has(m.id)).map(m=>m.id);
    if (rest.length) threads.push({key:"cx",name:"Other",ids:rest,subs:["Updates"]});
    threads.sort((a,b)=>b.ids.length-a.ids.length).forEach((t,i)=>{ t.color = TCOL[i%TCOL.length]; if(!t.subs.length) t.subs=["Updates"]; });
    const items = (r.items||[]).filter(i=>valid.has(Number(i.id)) && ["decision","request","task","risk"].includes(i.kind))
      .map(i=>({id:Number(i.id),kind:i.kind,text:String(i.text||""),owner:String(i.owner||""),due:String(i.due||"")})).sort((a,b)=>a.id-b.id);
    if (!threads.length) throw {code:"invalid_json"};
    state.an = {source:"claude", summary:String(r.summary||state.an.summary), threads, items, next:(r.next||[]).map(String).slice(0,8)};
    state.thread = null; store.set("analysis",{key:chatKey(), an:state.an});
    aiCtl = null; closeLayer(); render(true); achieve("Deep scan complete", "Claude re-mapped your threads and quests");
  }catch(e){
    aiCtl = null; if (e?.code==="cancelled") return; closeLayer();
    const copy = {not_granted:"Claude wasn't allowed for this page. On-device sorting stays on.",sampling_disabled:"Claude isn't available on this account.",rate_limited:"Too many requests right now. Try again in a few minutes.",prompt_too_large:"This chat is too long to send in one go.",invalid_json:"Claude's answer couldn't be read. Try again.",session_expired:"Sign in to Claude again, then retry."};
    achieve("Scan failed", copy[e?.code] || "Claude couldn't finish. Try again.");
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e?.code)){ sampleFn = null; render(); }
  }
}

/* ---------- layer / copy ---------- */
let lastFocus = null;
function layer(html){ if (!$("#layer").innerHTML) lastFocus = document.activeElement; $("#layer").innerHTML = html; ($("#layer").querySelector(".drop,.src[aria-pressed='true'],textarea,input,button:not([data-close])")||$("#layer").querySelector("button"))?.focus(); }
function closeLayer(){ if (aiCtl){ aiCtl.abort(); aiCtl=null; } $("#layer").innerHTML = ""; lastFocus?.focus?.(); }
function copyText(text, el){
  navigator.clipboard.writeText(text).then(()=>achieve("Copied","Paste it into WhatsApp")).catch(()=>{ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); achieve("Text selected","Press Ctrl+C to copy"); });
}

/* ---------- boot sequence ---------- */
function boot(done, force){
  let seen = false; try{ seen = sessionStorage.getItem("tl.boot"); }catch(e){}
  if (STILL || PARAMS.has("nointro") || (seen && !force)) return done();
  try{ sessionStorage.setItem("tl.boot","1"); }catch(e){}
  const ppl = new Set(state.msgs.map(m=>m.author)).size;
  const lines = ["linking whatsapp export", `parsing ${state.msgs.length} messages`, `mapping ${ppl} crew members`, `locking ${state.an.threads.length} threads`, `${openItems().length} open quests detected`, "signal acquired"];
  const b = document.createElement("div"); b.className = "boot"; b.setAttribute("role","status");
  b.innerHTML = `<div><img class="emblem" src="assets/core.jpg" alt=""><h2 class="glitch go" data-text="THREADLINE">THREADLINE</h2><div class="bar"><i></i></div><div class="log"></div><small>Click to skip</small></div>`;
  document.body.appendChild(b);
  let i = 0, finished = false;
  const end = () => { if (finished) return; finished = true; b.classList.add("out"); setTimeout(()=>b.remove(),600); done(); };
  b.addEventListener("click", end); addEventListener("keydown", end, {once:true});
  const next = () => { if (finished) return; if (i>=lines.length) return setTimeout(end, 350);
    const row = document.createElement("div"); b.querySelector(".log").appendChild(row);
    let c = 0; const txt = lines[i]; const t = setInterval(()=>{ row.textContent = txt.slice(0, ++c); if (c>=txt.length){ clearInterval(t); i++; b.querySelector(".bar i").style.width = (i/lines.length*100)+"%"; setTimeout(next, 120); } }, 16); };
  setTimeout(next, 300);
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  if (e.target.closest("[data-close]")) return closeLayer();
  const t = e.target.closest("button,label") || e.target;
  const d = t.dataset || {};
  if (d.view) return go(d.view);
  if (d.go) return go(d.go);
  if (d.act==="import") return openImport();
  if (d.act==="claude") return deepAnalysis();
  if (d.act==="stopAi") return closeLayer();
  if (d.act==="hideGuide"){ state.guide=false; store.set("guideHidden",1); return render(); }
  if (d.act==="sample"){ store.del("chat"); store.del("analysis"); load(SAMPLE,SAMPLE_NAME,true); closeLayer(); go("overview"); return achieve("Sample loaded","Explore the demo mission"); }
  if (d.src){ imp.src = d.src; imp.err=""; return drawImport(); }
  if (d.imp==="paste") return imp.text.trim() ? checkText(imp.text,"Pasted chat") : (imp.err="Paste a few lines of the chat first.", drawImport());
  if (d.imp==="back"){ imp.step=1; imp.err=""; return drawImport(); }
  if (d.imp==="open") return finishImport();
  if (d.done){
    const id = d.done, was = !!state.done[id]; const r = t.getBoundingClientRect();
    if (was) delete state.done[id]; else state.done[id]=1; store.set("done:"+chatKey(),state.done);
    const who = t.closest(".drawer")?.getAttribute("aria-label");
    render(); if (who) openPerson(who);
    if (!was){ burst(r.left+r.width/2, r.top+r.height/2); const left = openItems().length; achieve(left ? "Quest complete" : "Mission clear", left ? `+25 XP · ${left} still open · ${resolvedPct()}% resolved` : "Every open item in this chat is done"); }
    return;
  }
  if (d.person !== undefined) return openPerson(d.person);
  if (d.thread){ state.thread = d.thread; return go("threads"); }
  if (d.chatthread){ state.threadF = d.chatthread; state.q=""; state.kindF=""; return go("chat"); }
  if (d.pf !== undefined){ state.personF = d.pf; return render(); }
  if (d.tf !== undefined){ state.threadF = d.tf; return render(); }
  if (d.kf !== undefined){ state.kindF = d.kf; return render(); }
  if (d.copy) return copyText(outText(d.copy), $("#out-"+d.copy));
});
document.addEventListener("input", e=>{
  if (e.target.id!=="search") return;
  state.q = e.target.value; const pos = e.target.selectionStart; render(); const s = $("#search"); s.focus(); s.setSelectionRange(pos,pos);
});
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && $("#layer").innerHTML) closeLayer(); if (e.key==="Enter" && e.target.id==="pname") finishImport(); });
let rT, lastW = innerWidth; addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if (state.view==="overview" && Math.abs(innerWidth-lastW)>40){ lastW = innerWidth; drawPulse(false); drawOrbit(false); } },160); });

/* ---------- start ---------- */
const saved = store.get("chat");
if (!(saved && load(saved.text, saved.name, false))) load(SAMPLE, SAMPLE_NAME, true);
const h = (location.hash||"").slice(1); if (["overview","threads","board","people","chat","outputs"].includes(h)) state.view = h;
boot(() => render(true));
(async()=>{ try{ sampleFn = await window.claude?.use?.("sample"); }catch(e){ sampleFn = null; } if (sampleFn) document.querySelectorAll('[data-act="claude"]').forEach(b=>b.hidden=false); })();
</script>
